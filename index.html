<script type="text/babel">
const {useState,useEffect}=React;

/* ══════════════════════════════════════════════════════════════
   DISPERSIÓN GEOGRÁFICA — Mapa de México
   ══════════════════════════════════════════════════════════════ */
function ViewGeoDispersion({db,execId}){
  const STATE_COORDS={"Aguascalientes": [340, 310], "Baja California": [90, 160], "Baja California Sur": [130, 260], "Campeche": [560, 390], "Chiapas": [540, 430], "Chihuahua": [220, 190], "Ciudad de M\u00e9xico": [405, 360], "Coahuila": [290, 220], "Colima": [330, 390], "Durango": [255, 270], "Guanajuato": [370, 320], "Guerrero": [400, 410], "Hidalgo": [430, 330], "Jalisco": [320, 340], "Estado de M\u00e9xico": [400, 350], "Michoac\u00e1n": [360, 370], "Morelos": [415, 370], "Nayarit": [285, 320], "Nuevo Le\u00f3n": [330, 230], "Oaxaca": [470, 420], "Puebla": [450, 360], "Quer\u00e9taro": [395, 315], "Quintana Roo": [620, 380], "San Luis Potos\u00ed": [380, 280], "Sinaloa": [220, 290], "Sonora": [170, 180], "Tabasco": [530, 400], "Tamaulipas": [370, 250], "Tlaxcala": [445, 350], "Veracruz": [470, 360], "Yucat\u00e1n": [590, 360], "Zacatecas": [320, 275]};
  const [filtExec,setFiltExec]=useState("");
  const [hovered,setHovered]=useState(null);
  const [selectedState,setSelectedState]=useState(null);

  const clientes=db.cartaraCompleta||[];
  // execId=null means Director (all), otherwise filter by exec
  const baseClientes=execId?clientes.filter(c=>c.claveEjec===execId):clientes;
  const filtered=filtExec?baseClientes.filter(c=>c.claveEjec===filtExec):baseClientes;
  const isDir=!execId;

  // Count by state
  const byState={};
  filtered.forEach(c=>{
    const est=(c.estado||'').trim();
    if(est){byState[est]=(byState[est]||0)+1;}
  });
  const maxCount=Math.max(...Object.values(byState),1);

  const statesWithClients=Object.entries(byState).sort((a,b)=>b[1]-a[1]);
  const totalConEstado=filtered.filter(c=>c.estado&&c.estado.trim()).length;
  const sinEstado=filtered.length-totalConEstado;

  const getColor=(count)=>{
    if(!count)return"rgba(200,220,240,0.2)";
    const intensity=count/maxCount;
    if(intensity>0.7)return"#F47920";
    if(intensity>0.4)return"#FB923C";
    if(intensity>0.2)return"#FCD34D";
    return"#FEF08A";
  };

  const downloadGeoXLS=()=>{
    const rows=[['Estado','Clientes','% del Total'],...statesWithClients.map(([st,cnt])=>[st,cnt,Math.round(cnt/Math.max(totalConEstado,1)*100)+'%'])];
    const ws=XLSX.utils.aoa_to_sheet(rows);
    ws['!cols']=[{wch:25},{wch:12},{wch:12}];
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,'Geografía');
    XLSX.writeFile(wb,'Dispersion_Geografica_Afimex.xlsx');
  };

  return(
    <div style={{padding:"16px 20px",maxWidth:1100,margin:"0 auto"}}>
      <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:16,flexWrap:"wrap"}}>
        <div style={{fontSize:14,fontWeight:700,color:P.dark}}>🗺️ Dispersión Geográfica de Clientes</div>
        {isDir&&(<select value={filtExec} onChange={e=>setFiltExec(e.target.value)}
          style={{padding:"4px 8px",borderRadius:6,border:"1px solid "+P.cbd,fontSize:11}}>
          <option value="">Todos los ejecutivos</option>
          {db.team.map(t=>(<option key={t.id} value={t.id}>{t.name}</option>))}
        </select>)}
        <span style={{fontSize:11,color:P.textMd}}>{filtered.length} clientes · {totalConEstado} con estado registrado</span>
        <button onClick={downloadGeoXLS}
          style={{padding:"6px 14px",background:"#15803D",color:"#fff",border:"none",borderRadius:7,fontSize:11,fontWeight:700,cursor:"pointer"}}>
          📥 Descargar Excel
        </button>
      </div>

      <div style={{display:"grid",gridTemplateColumns:"1fr 320px",gap:16,alignItems:"start"}}>
        {/* MAP */}
        <div style={{background:"#fff",borderRadius:10,border:"1px solid "+P.cbd,padding:"12px",overflow:"hidden"}}>
          <div style={{fontSize:10,color:P.textMd,marginBottom:8,textAlign:"center"}}>Haz hover sobre cada estado para ver el detalle</div>
          <svg viewBox="0 0 800 600" style={{width:"100%",height:"auto"}}>
            {/* Mexico background */}
            <rect x="50" y="100" width="700" height="420" rx="8" fill="#F0F7FF" stroke="#CBD5E1" strokeWidth="1"/>
            <text x="400" y="540" textAnchor="middle" fill="#94A3B8" fontSize="12">República Mexicana</text>

            {/* State bubbles */}
            {Object.entries(STATE_COORDS).map(([state,[x,y]])=>{
              const count=byState[state]||0;
              const r=count?Math.max(12,Math.min(40,10+count*2)):8;
              const color=getColor(count);
              const isHov=hovered===state;
              return(
                <g key={state} onMouseEnter={()=>setHovered(state)} onMouseLeave={()=>setHovered(null)}
                  onClick={()=>count>0&&setSelectedState(selectedState===state?null:state)}
                  style={{cursor:count?"pointer":"default"}}>
                  <circle cx={x} cy={y} r={r} fill={color} stroke={isHov?"#F47920":"#94A3B8"}
                    strokeWidth={isHov?2.5:0.5} opacity={count?0.9:0.3}/>
                  {count>0&&(
                    <text x={x} y={y+1} textAnchor="middle" dominantBaseline="middle"
                      fill={count/maxCount>0.4?"#fff":"#92400E"}
                      fontSize={r>20?11:9} fontWeight="700">{count}</text>
                  )}
                  {!count&&(
                    <text x={x} y={y+1} textAnchor="middle" dominantBaseline="middle"
                      fill="#94A3B8" fontSize="7">{state.slice(0,3)}</text>
                  )}
                  {isHov&&(
                    <g>
                      <rect x={x+r+4} y={y-18} width={Math.max(state.length*5.5+16,80)} height={38}
                        rx="4" fill="rgba(15,23,42,.9)"/>
                      <text x={x+r+12} y={y-5} fill="#fff" fontSize="10" fontWeight="700">{state}</text>
                      <text x={x+r+12} y={y+11} fill="#94A3B8" fontSize="9">{count} cliente{count!==1?"s":""}</text>
                    </g>
                  )}
                </g>
              );
            })}

            {/* Legend */}
            <g transform="translate(55,115)">
              <text fontSize="9" fill="#64748B" fontWeight="700">CONCENTRACIÓN</text>
              {[["#FEF08A","Baja"],["#FCD34D","Media"],["#FB923C","Alta"],["#F47920","Muy alta"]].map(([c,l],i)=>(
                <g key={i} transform={"translate(0,"+(i*16+14)+")"}>
                  <circle r="6" cx="6" cy="0" fill={c} opacity="0.9"/>
                  <text x="16" y="4" fontSize="8" fill="#475569">{l}</text>
                </g>
              ))}
            </g>
          </svg>
        </div>

        {/* TABLE */}
        <div style={{display:"flex",flexDirection:"column",gap:12}}>
          <div style={{background:"#fff",borderRadius:10,border:"1px solid "+P.cbd,overflow:"hidden"}}>
            <div style={{background:P.dark,padding:"8px 12px",fontSize:10,fontWeight:700,color:"#fff",textTransform:"uppercase",letterSpacing:.5}}>
              Top Estados
            </div>
            {statesWithClients.length>0?(
              <div style={{maxHeight:300,overflowY:"auto"}}>
                <table style={{width:"100%",borderCollapse:"collapse",fontSize:11}}>
                  <thead style={{position:"sticky",top:0,background:"#F8FAFC"}}>
                    <tr>
                      <th style={{padding:"6px 10px",textAlign:"left",fontWeight:700,color:P.textMd}}>Estado</th>
                      <th style={{padding:"6px 10px",textAlign:"center",fontWeight:700,color:P.textMd}}>Clientes</th>
                      <th style={{padding:"6px 10px",textAlign:"center",fontWeight:700,color:P.textMd}}>%</th>
                    </tr>
                  </thead>
                  <tbody>
                    {statesWithClients.map(([state,cnt],i)=>(
                      <tr key={state} style={{borderTop:"1px solid "+P.cbd,background:i%2===0?"#fff":"#FAFBFF"}}>
                        <td style={{padding:"6px 10px"}}>{state}</td>
                        <td style={{padding:"6px 10px",textAlign:"center",fontWeight:700}}>{cnt}</td>
                        <td style={{padding:"6px 10px",textAlign:"center",color:P.textMd}}>
                          {Math.round(cnt/totalConEstado*100)||0}%
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            ):(
              <div style={{padding:20,textAlign:"center",color:P.textMd,fontSize:11}}>
                Sin datos de estado.<br/>
                Sube la plantilla de Cartera Completa con la columna Estado.
              </div>
            )}
          </div>

          {sinEstado>0&&(
            <div style={{background:"#FFF9C4",border:"1px solid #FDE047",borderRadius:8,padding:"8px 12px",fontSize:10,color:"#854D0E"}}>
              ⚠️ {sinEstado} cliente{sinEstado!==1?"s":""} sin estado registrado
            </div>
          )}

      {/* DETALLE DEL ESTADO SELECCIONADO */}
      {selectedState&&(()=>{
        const stateClients=filtered.filter(c=>(c.estado||'').trim()===selectedState);
        return(
          <div style={{marginTop:16,background:"#fff",borderRadius:10,border:"1.5px solid "+P.cbd,overflow:"hidden"}}>
            <div style={{background:P.dark,padding:"10px 16px",display:"flex",alignItems:"center",gap:10}}>

/* ── Helpers ──────────────────────────────────────────────────── */
const parseNum=v=>{const n=parseFloat(String(v).replace(/[$,%]/g,""));return isNaN(n)?0:n;};
const calcPct=(val,kpi)=>{
  const n=parseNum(val);if(!n)return 0;
  if(kpi.isInverse)return n<=kpi.meta?100:Math.min((kpi.meta/n)*100,100);
  return Math.min((n/kpi.meta)*100,150);
};
const calcAvg=(kpis,vals)=>{
  const ps=kpis.map(k=>calcPct(vals[k.id]||"",k)).filter(p=>p>0);
  return ps.length?ps.reduce((a,b)=>a+b,0)/ps.length:0;
};
const fmtMeta=k=>{const s=k.isInverse?"<":"≥";if(k.isCurrency)return "$"+k.meta.toLocaleString("es-MX");if(k.isPercent)return s+" "+k.meta+"%";return s+" "+k.meta;};
const fmtReal=(v,k)=>{const n=parseNum(v);if(!n)return"—";if(k.isCurrency)return"$"+n.toLocaleString("es-MX");if(k.isPercent)return n+"%";return String(n);};
const barColor=p=>p>=100?P.green:p>=75?P.amber:p>0?P.red:P.cbd;
const pctLbl=p=>p===0?"—":Math.round(p)+"%";
const statusLbl=p=>p>=100?"En meta":p>=75?"En progreso":p>0?"Por debajo":"—";
const parseWeekKey=wk=>{const m=wk.match(/^Sem\s+(\S+)\s+·\s+(.+)$/);return m?{semana:m[1],mes:m[2]}:null;};

function recomputeFromClients(clientes){
  const base=clientes.filter(c=>c.p25>0);
  const ret=base.filter(c=>c.p26>0);
  const vol25=base.reduce((s,c)=>s+c.p25,0);
  const vol26=base.reduce((s,c)=>s+c.p26,0);
  const conJul25=base.filter(c=>c.jp25>0);
  const vj25=conJul25.reduce((s,c)=>s+c.jp25,0);
  const vj26=conJul25.reduce((s,c)=>s+c.jp26,0);
  const comp=clientes.filter(c=>c.f25>0&&c.f26>0);
  const s25f=comp.reduce((s,c)=>s+c.f25,0);
  const s26f=comp.reduce((s,c)=>s+c.f26,0);
  const compJul=clientes.filter(c=>c.jf25>0&&c.jf26>0);
  const sj25f=compJul.reduce((s,c)=>s+c.jf25,0);
  const sj26f=compJul.reduce((s,c)=>s+c.jf26,0);
  const dt=comp.filter(c=>c.f26<c.f25);
  const dtJul=compJul.filter(c=>c.jf26<c.jf25);
  const updated=clientes.map(c=>({
    ...c,
    ret:c.p25>0&&c.p26>0, prd:c.p25>0&&c.p26===0, nw:c.p25===0&&c.p26>0,
    cmp:c.f25>0&&c.f26>0, dwn:c.f25>0&&c.f26>0&&c.f26<c.f25,
    cft:c.f25>0&&c.f26>0?+((c.f26-c.f25)/c.f25*100).toFixed(1):null,
    cpq:c.p25>0&&c.p26>0?+((c.p26-c.p25)/c.p25*100).toFixed(1):null,
  }));
  return{
    clientes:updated,
    ret:{
      n_base:base.length, n_retenidos:ret.length,
      n_perdidos:base.length-ret.length,
      n_nuevos26:clientes.filter(c=>c.p25===0&&c.p26>0).length,
      pct_clientes:base.length?+(ret.length/base.length*100).toFixed(1):0,
      vol_q3_2025:vol25, vol_2026_acum:vol26,
      pct_volumen:vol25?+(vol26/vol25*100).toFixed(1):0,
      pct_vol_jul:vj25?+(vj26/vj25*100).toFixed(1):0,
    },
    crec:{
      n_comparables:comp.length, fact_q3_2025:s25f, fact_2026_acum:s26f,
      pct:s25f?+((s26f-s25f)/s25f*100).toFixed(1):0,
      pct_jul:sj25f?+((sj26f-sj25f)/sj25f*100).toFixed(1):0,
      n_comp_jul:compJul.length,
    },
    leal:{
      n_comparables:comp.length, n_dt:dt.length,
      pct:comp.length?+(dt.length/comp.length*100).toFixed(1):0,
      n_dt_jul:dtJul.length, n_comp_jul:compJul.length,
      pct_jul:compJul.length?+(dtJul.length/compJul.length*100).toFixed(1):0,
    }
  };
}

function importMatrixUpdate(file,db,onSuccess,onError){
  if(!window.__MATRIX__){onError("No hay datos base de matriz.");return;}
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const wb=XLSX.read(e.target.result,{type:"binary"});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:""});
      const dataRows=rows.slice(4).filter(r=>r[0]&&r[3]);
      if(!dataRows.length){onError("No se encontraron datos.");return;}
      const byExec={};
      const pf=v=>parseFloat(v)||0;
      dataRows.forEach(row=>{
        const eid=String(row[0]).trim();
        if(!byExec[eid])byExec[eid]=[];
        // cols: 0=ID,1=nombre,2=numCli,3=razon,4=tipo
        // 5-12: 2025 ref (no editar)
        // 13=jf26,14=af26,15=sf26
        // 16=jp26,17=ap26,18=sp26
        // 19=ppjul,20=ppago,21=ppsep
        const jf26=pf(row[13]), af26=pf(row[14]), sf26=pf(row[15]);
        const jp26=pf(row[16]), ap26=pf(row[17]), sp26=pf(row[18]);
        const ppjul=pf(row[19]), ppago=pf(row[20]), ppsep=pf(row[21]);
        byExec[eid].push({
          num:String(row[2]||"").trim(),
          nom:String(row[3]||"").trim(),
          tp:String(row[4]||"").trim(),
          jf26,af26,sf26, jp26,ap26,sp26,
          ppjul,ppago,ppsep,
          f26:jf26+af26+sf26,
          p26:jp26+ap26+sp26,
          pp_q3:ppjul+ppago+ppsep,
        });
      });
      const newMatrix=JSON.parse(JSON.stringify(window.__MATRIX__));
      let updated=0,added=0;
      Object.entries(byExec).forEach(([eid,upds])=>{
        if(!newMatrix[eid])return;
        const existingNums=new Set(newMatrix[eid].clientes.map(c=>String(c.n||"").trim()).filter(Boolean));
        const existingNoms=new Set(newMatrix[eid].clientes.map(c=>c.nom.toLowerCase()));
        const updatedClients=newMatrix[eid].clientes.map(c=>{
          const match=upds.find(u=>
            (u.num&&u.num===String(c.n||"").trim())||
            u.nom.toLowerCase()===c.nom.toLowerCase()
          );
          if(!match)return c;
          return{...c,
            jf26:match.jf26,af26:match.af26,sf26:match.sf26,
            jp26:match.jp26,ap26:match.ap26,sp26:match.sp26,
            f26:match.f26, p26:match.p26,
            ppjul:match.ppjul,ppago:match.ppago,ppsep:match.ppsep,pp_q3:match.pp_q3,
          };
        });
        const nuevos=upds
          .filter(u=>!(u.num&&existingNums.has(u.num))&&!existingNoms.has(u.nom.toLowerCase()))
          .filter(u=>u.nom)
          .map(u=>({
            n:u.num,nom:u.nom,tp:u.tp||"",
            p25:0,jp25:0,f25:0,jf25:0,af25:0,sf25:0,ap25:0,sp25:0,
            p26:u.p26,jp26:u.jp26,af26:u.af26,ap26:u.ap26,sf26:u.sf26,sp26:u.sp26,
            f26:u.f26,jf26:u.jf26,
            ppjul:u.ppjul,ppago:u.ppago,ppsep:u.ppsep,pp_q3:u.pp_q3,
            ret:false,prd:false,nw:u.p26>0,cmp:false,dwn:false,cft:null,cpq:null,
          }));
        added+=nuevos.length;
        const allClients=[...updatedClients,...nuevos];
        const recomp=recomputeFromClients(allClients);
        newMatrix[eid]={...newMatrix[eid],...recomp};
        updated++;
      });
      window.__MATRIX__=newMatrix;
      try{localStorage.setItem("afimex_matrix_v1",JSON.stringify(newMatrix));}catch{}
      onSuccess(updated,Object.keys(byExec).length,added);
    }catch(err){onError("Error: "+err.message);}
  };
  reader.readAsBinaryString(file);
}

const STORE_KEY="afimex_tracker_v2";
const SYNC_URL='https://jsonblob.com/api/jsonBlob';

async function syncPull(sid){
  try{
    const r=await fetch(SYNC_URL+'/'+sid,{headers:{'Accept':'application/json'},cache:'no-store'});
    if(r.ok)return await r.json();
  }catch(e){}
  return null;
}

// Merge + Push: primero baja del cloud, fusiona con datos locales, sube el resultado
async function syncMergeAndPush(localData){
  const sid=localStorage.getItem('afimex_sync_id')||window.__SYNC_ID__;
  if(!sid)return localData;
  try{
    const cloud=await syncPull(sid)||{weeks:{},ventasNuevas:[],cartera:[]};
    // Semanas: cloud como base, local sobreescribe por exec/semana
    const merged={weeks:{...cloud.weeks},ventasNuevas:[...(cloud.ventasNuevas||[])],cartera:cloud.cartera||[]};
    Object.entries(localData.weeks||{}).forEach(([wk,execs])=>{
      if(!merged.weeks[wk])merged.weeks[wk]={};
      Object.entries(execs).forEach(([eid,data])=>{ merged.weeks[wk][eid]=data; });
    });
    // Ventas nuevas: fusionar sin duplicados por id
    const vMap={};
    [...(merged.ventasNuevas||[]),...(localData.ventasNuevas||[])].forEach(v=>{if(v.id)vMap[v.id]=v;});
    merged.ventasNuevas=Object.values(vMap);
    // Cartera: la que tenga más registros
    if((localData.cartera||[]).length>=(merged.cartera||[]).length)merged.cartera=localData.cartera||[];
    // Subir resultado al cloud
    await fetch(SYNC_URL+'/'+sid,{
      method:'PUT',headers:{'Content-Type':'application/json','Accept':'application/json'},
      body:JSON.stringify({weeks:merged.weeks,ventasNuevas:merged.ventasNuevas,cartera:merged.cartera})
    });
    // Guardar fusión en localStorage
    try{localStorage.setItem(STORE_KEY,JSON.stringify(merged));}catch{}
    return merged;
  }catch(e){return localData;}
}

async function syncCreate(data){
  try{
    const r=await fetch(SYNC_URL,{
      method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},
      body:JSON.stringify({weeks:data.weeks||{},ventasNuevas:data.ventasNuevas||[],cartera:data.cartera||[]})
    });
    if(r.ok){
      const loc=r.headers.get('Location')||'';
      const sid=loc.split('/').pop();
      if(sid){localStorage.setItem('afimex_sync_id',sid);return sid;}
    }
  }catch(e){}
  return null;
}

const loadData=()=>{
  const team=DEFAULT_TEAM.map(e=>({...e}));
  const validIds=new Set(DEFAULT_TEAM.map(e=>e.id));
  // 1) Local storage tiene datos → usarlos
  try{
    const s=JSON.parse(localStorage.getItem(STORE_KEY)||'null');
    if(s&&(Object.keys(s.weeks||{}).length>0||(s.ventasNuevas||[]).length>0||(s.cartera||[]).length>0)){
      const v=(s.ventasNuevas||[]).filter(x=>validIds.has(x.ejecutivoId));
      return{team,weeks:s.weeks||{},ventasNuevas:v,cartera:s.cartera||[],cartaraCompleta:s.cartaraCompleta||[]};
    }
  }catch{}
  // 2) Sin datos locales: retornar vacío (la carga desde nube es async, se hace en App)
  return{team,weeks:{},ventasNuevas:[],cartera:[]};
};

const saveData=d=>{
  const p=JSON.stringify({weeks:d.weeks||{},ventasNuevas:d.ventasNuevas||[],cartera:d.cartera||[],cartaraCompleta:d.cartaraCompleta||[]});
  if(typeof window.storage!=="undefined"){window.storage.set("afimex_db",p,true).catch(()=>{});}
  try{localStorage.setItem(STORE_KEY,p);}catch{}
};

function PinScreen({execId,team,onSuccess,onBack}){
  const [pin,setPin]=useState("");
  const [error,setError]=useState(false);
  const [shake,setShake]=useState(false);
  const exec=team.find(e=>e.id===execId)||{name:"Dirección Comercial",role:"DIR",id:"DIR"};
  const roleColor=execId==="DIR"?"#F47920":(ROLE_COLOR[exec.role]||"#F47920");

  const handleDigit=d=>{
    if(pin.length>=4)return;
    const next=pin+d;
    setPin(next);setError(false);
    if(next.length===4){
      if(next===PINS[execId]){setTimeout(()=>onSuccess(),150);}
      else{setShake(true);setTimeout(()=>{setPin("");setShake(false);setError(true);},500);}
    }
  };
  const handleDel=()=>{setPin(p=>p.slice(0,-1));setError(false);};

  const digits=["1","2","3","4","5","6","7","8","9","","0","⌫"];

  return(
    <div style={{minHeight:"100vh",background:P.dark,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:24}}>
      {/* Back */}
      <button onClick={onBack} style={{position:"absolute",top:20,left:20,background:"rgba(255,255,255,.1)",border:"none",color:"rgba(255,255,255,.6)",padding:"8px 14px",borderRadius:20,fontSize:12,cursor:"pointer"}}>

      {/* Logo */}
      <img src={window.__LOGO__} style={{height:44,objectFit:"contain",marginBottom:28}} alt="Afimex"/>

      {/* Avatar */}
      <div style={{width:70,height:70,borderRadius:"50%",background:roleColor,display:"flex",alignItems:"center",justifyContent:"center",fontSize:22,fontWeight:800,color:"#fff",marginBottom:14,boxShadow:"0 0 0 4px rgba(255,255,255,.1)"}}>
        {execId==="DIR"?"📊":execId}
      </div>
      <div style={{fontSize:16,fontWeight:700,color:"#fff",marginBottom:4,textAlign:"center"}}>{exec.name}</div>
      <div style={{fontSize:11,color:roleColor,fontWeight:600,textTransform:"uppercase",letterSpacing:1,marginBottom:28}}>
        {execId==="DIR"?"Dirección Comercial":exec.role}
      </div>

      {/* PIN dots */}
      <div style={{display:"flex",gap:16,marginBottom:10,
        animation:shake?"shake 0.4s":"none"}}>
        {[0,1,2,3].map(i=>(
          <div key={i} style={{width:16,height:16,borderRadius:"50%",
            background:i<pin.length?roleColor:"rgba(255,255,255,.2)",
            border:"2px solid "+(i<pin.length?roleColor:"rgba(255,255,255,.3)"),
            transition:"all .15s"}}/>
        ))}
      </div>
      {error&&<div style={{fontSize:11,color:"#F87171",fontWeight:600,marginBottom:8}}>PIN incorrecto. Intenta de nuevo.</div>}
      {!error&&<div style={{fontSize:11,color:"rgba(255,255,255,.3)",marginBottom:8}}>Ingresa tu PIN de 4 dígitos</div>}

      {/* Keypad */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(3,72px)",gap:10,marginTop:8}}>
        {digits.map((d,i)=>(
          <button key={i} onClick={()=>{if(d==="⌫")handleDel();else if(d)handleDigit(d);}}
            style={{height:64,borderRadius:12,border:"none",
              background:d?"rgba(255,255,255,.1)":"transparent",
              color:"#fff",fontSize:d==="⌫"?20:22,fontWeight:600,cursor:d?"pointer":"default",
              transition:"all .1s"}}
            onMouseEnter={e=>{if(d)e.currentTarget.style.background="rgba(255,255,255,.2)";}}
            onMouseLeave={e=>{if(d)e.currentTarget.style.background="rgba(255,255,255,.1)";}}>
            {d}
          </button>
        ))}
      </div>

      <style>{`@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}`}</style>
    <div style={{marginTop:14,textAlign:"center"}}>
      <button onClick={()=>{
        const inp=document.createElement("input");
        inp.type="file";inp.accept=".json";
        inp.onchange=ev=>{
          if(!ev.target.files[0])return;
          const reader=new FileReader();
          reader.onload=e=>{
            try{
              const d=JSON.parse(e.target.result);
              if(!d.weeks)throw new Error("Archivo inválido");
              const cur=JSON.parse(localStorage.getItem(STORE_KEY)||"null")||{weeks:{},ventasNuevas:[],cartera:[]};
              const mw={...cur.weeks};
              Object.entries(d.weeks||{}).forEach(([wk,execs])=>{
                if(!mw[wk])mw[wk]={};
                Object.entries(execs).forEach(([eid,v])=>{mw[wk][eid]=v;});
              });
              localStorage.setItem(STORE_KEY,JSON.stringify({
                weeks:mw,
                ventasNuevas:d.ventasNuevas||cur.ventasNuevas||[],
                cartera:d.cartera||cur.cartera||[]
              }));
              window.location.reload();
            }catch(err){alert("Error: "+err.message);}
          };
          reader.readAsText(ev.target.files[0]);
        };
        inp.click();
      }}
        style={{padding:"6px 16px",background:"rgba(255,255,255,.12)",color:"rgba(255,255,255,.65)",
          border:"1px solid rgba(255,255,255,.2)",borderRadius:7,fontSize:10,cursor:"pointer"}}>
        📥 Importar datos compartidos
      </button>
    </div>
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════
   HISTORIAL PROPIO DEL EJECUTIVO
   ══════════════════════════════════════════════════════════════ */
function ExecHistorial({exec,db}){
  const kpis=ROLES[exec.role]?.kpis||[];
  const bonos=ROLES[exec.role]?.bonos||[];
  const roleColor=ROLE_COLOR[exec.role];
  const allWeeks=Object.keys(db.weeks||{}).sort().reverse();
  const myWeeks=allWeeks.filter(w=>db.weeks[w]&&db.weeks[w][exec.id]);

  if(!myWeeks.length) return(
    <div style={{padding:"40px 24px",textAlign:"center"}}>
      <div style={{fontSize:40,marginBottom:16}}>📋</div>
      <div style={{fontSize:14,fontWeight:700,color:P.textDk}}>Aún no tienes semanas guardadas</div>
      <div style={{fontSize:12,color:P.textMd,marginTop:8}}>Ve a "Mi Captura" y guarda tu primera semana para ver tu historial aquí.</div>
    </div>
  );

  return(
    <div style={{padding:"18px 22px"}}>
      <div style={{fontSize:13,fontWeight:700,color:P.textDk,marginBottom:16}}>
        Tu avance semana a semana
      </div>

      {/* KPI History Table */}
      <div style={{overflowX:"auto",marginBottom:20}}>
        <table style={{width:"100%",borderCollapse:"collapse",background:"#fff",borderRadius:10,overflow:"hidden",boxShadow:"0 2px 8px rgba(10,40,90,.08)"}}>
          <thead>
            <tr>
              <th style={{background:P.dark,padding:"10px 14px",textAlign:"left",fontSize:10,fontWeight:700,color:"#fff",minWidth:130}}>Semana</th>
              {kpis.map(k=>(
                <th key={k.id} style={{background:roleColor,padding:"10px 10px",textAlign:"center",fontSize:9,fontWeight:700,color:"#fff",minWidth:90}}>
                  <div>{k.id}</div><div style={{fontSize:8,opacity:.8,marginTop:2}}>{k.name}</div>
                </th>
              ))}
              <th style={{background:"#F47920",padding:"10px 10px",textAlign:"center",fontSize:10,fontWeight:800,color:"#fff",minWidth:90}}>GRAL.</th>
            </tr>
          </thead>
          <tbody>
            {myWeeks.map((week,idx)=>{
              const wd=db.weeks[week][exec.id];
              const vals=wd.kpis||{};
              const pcts=kpis.map(k=>calcPct(vals[k.id]||"",k));
              const avg=calcAvg(kpis,vals);
              const rbg=idx%2===0?"#fff":P.bgl;
              return(
                <tr key={week}>
                  <td style={{padding:"10px 14px",borderBottom:"1px solid "+P.cbd,background:rbg,fontSize:11,fontWeight:600,color:P.textDk}}>{week}</td>
                  {pcts.map((pct,pi)=>{
                    const col=barColor(pct);
                    const cellBg=pct>=100?P.lgBg:pct>=75?P.laBg:pct>0?P.lrBg:rbg;
                    return(
                      <td key={pi} style={{padding:"8px 6px",borderBottom:"1px solid "+P.cbd,background:cellBg,textAlign:"center"}}>
                        <div style={{fontSize:13,fontWeight:800,color:pct>0?col:P.textMd}}>{pctLbl(pct)}</div>
                        <div style={{fontSize:8,color:P.textMd,marginTop:2}}>{fmtReal(vals[kpis[pi].id]||"",kpis[pi])}</div>
                        <div style={{width:44,margin:"3px auto 0"}}><Bar pct={pct} thin/></div>
                      </td>
                    );
                  })}
                  <td style={{padding:"8px 10px",borderBottom:"1px solid "+P.cbd,textAlign:"center",
                    background:avg>=100?P.lgBg:avg>=75?P.laBg:avg>0?P.lrBg:rbg}}>
                    <div style={{fontSize:16,fontWeight:800,color:barColor(avg)}}>{pctLbl(avg)}</div>
                    <div style={{marginTop:4}}><Bar pct={avg} thin/></div>
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>

      {/* Bono History */}
      <div style={{fontSize:12,fontWeight:700,color:P.textDk,marginBottom:10}}>Avance de Bono Trimestral por semana</div>
      <div style={{overflowX:"auto"}}>
        <table style={{width:"100%",borderCollapse:"collapse",background:"#fff",borderRadius:10,overflow:"hidden",boxShadow:"0 2px 8px rgba(10,40,90,.08)"}}>
          <thead>
            <tr>
              <th style={{background:P.dark,padding:"9px 14px",textAlign:"left",fontSize:10,fontWeight:700,color:"#fff",minWidth:130}}>Semana</th>
              {bonos.map((b,i)=>(
                <th key={i} style={{background:"#F47920",padding:"9px 10px",textAlign:"center",fontSize:9,fontWeight:700,color:"#fff",minWidth:120}}>
                  {b.label}
                </th>
              ))}
            </tr>
          </thead>
          <tbody>
            {myWeeks.map((week,idx)=>{
              const wd=db.weeks[week][exec.id];
              const bonoVals=wd.bonos||{};
              const rbg=idx%2===0?"#fff":P.bgl;
              return(
                <tr key={week}>
                  <td style={{padding:"9px 14px",borderBottom:"1px solid "+P.cbd,background:rbg,fontSize:11,fontWeight:600,color:P.textDk}}>{week}</td>
                  {bonos.map((b,bi)=>{
                    const pct=calcPct(bonoVals[bi]||"",b);
                    const col=barColor(pct);
                    const cellBg=pct>=100?P.lgBg:pct>=75?P.laBg:pct>0?P.lrBg:rbg;
                    return(
                      <td key={bi} style={{padding:"8px 6px",borderBottom:"1px solid "+P.cbd,background:cellBg,textAlign:"center"}}>
                        <div style={{fontSize:13,fontWeight:800,color:pct>0?col:P.textMd}}>{pctLbl(pct)}</div>
                        <div style={{width:60,margin:"3px auto 0"}}><Bar pct={pct} thin/></div>
                      </td>
                    );
                  })}
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════
   COMPARATIVO DIRECTOR — equipo + historial por ejecutivo
   ══════════════════════════════════════════════════════════════ */
function DirComparativo({db,onGenPPT,onGenXLS,generating,genXLS,onImport}){
  const allWeeks=Object.keys(db.weeks||{}).sort().reverse();
  const [selWeek,setSelWeek]=useState(allWeeks[0]||"");
  const [histExec,setHistExec]=useState(null); // null = team view
  const [uploadMsg,setUploadMsg]=useState(null);
  const [syncMsg,setSyncMsg]=useState(null);
  const [matMsg,setMatMsg]=useState(null);
  const [matLoading,setMatLoading]=useState(false);
  const team=db.team;

  useEffect(()=>{if(allWeeks.length&&!selWeek)setSelWeek(allWeeks[0]);},[allWeeks.length]);

  const weekData=(db.weeks&&db.weeks[selWeek])||{};

  // Sincronizar indicadores de matriz para la semana seleccionada
  const handleMatDownload=()=>generateMatrixTemplate(db);
  const handleMatUpload=()=>{
    const inp=document.createElement("input");
    inp.type="file";inp.accept=".xlsx,.xls";
    inp.onchange=ev=>{
      if(!ev.target.files[0])return;
      setMatLoading(true);setMatMsg(null);
      importMatrixUpdate(ev.target.files[0],db,(upd,tot,add)=>{
        setMatLoading(false);
        setMatMsg({type:"success",text:"Indicadores actualizados para "+upd+" ejecutivos"+(add>0?" | "+add+" clientes nuevos":"")+"."});
        onImport({...db,_matrixVer:(db._matrixVer||0)+1});
      },err=>{setMatLoading(false);setMatMsg({type:"error",text:err});});
    };
    inp.click();
  };

  const handleSyncMatrix=()=>{
    if(!selWeek)return;
    const parsed=parseWeekKey(selWeek);
    if(!parsed)return;
    let nd={...db};
    team.forEach(exec=>{
      const md=window.__MATRIX__?.[exec.id];
      // KPIs y bonos desde matriz (solo si hay datos de matriz)
      const kpiMap=md?({
        Televentas:{"02":md.ret?.pct_clientes},
        MAE:       {"01":md.ret?.pct_clientes,"02":md.crec?.pct,"07":md.leal?.pct},
        KAD:       {"01":md.ret?.pct_clientes,"02":md.crec?.pct},
      }[exec.role]||{}):{};
      const bonoMap=md?({
        Televentas:{1:md.ret?.pct_clientes},
        MAE:       {0:md.ret?.pct_clientes,1:md.crec?.pct,2:md.leal?.pct},
        KAD:       {0:md.ret?.pct_clientes,1:md.crec?.pct},
      }[exec.role]||{}):{};
      // KPIs y bonos desde ventasNuevas (Hunter y Televentas)
      const myVentas=(db.ventasNuevas||[]).filter(v=>v.ejecutivoId===exec.id);
      const vc=myVentas.length;
      const vf=myVentas.reduce((s,v)=>s+(v.jul26||0)+(v.ago26||0)+(v.sep26||0),0);
      if(exec.role==="Televentas"&&vc>0){kpiMap["01"]=vc;bonoMap[0]=vc;}
      if(exec.role==="Hunter"){
        if(vc>0){kpiMap["01"]=vc;bonoMap[0]=vc;}
        if(vf>0){kpiMap["02"]=Math.round(vf);bonoMap[1]=Math.round(vf);}
      }
      if(!Object.keys(kpiMap).length&&!Object.keys(bonoMap).length)return;
      const existing=nd.weeks?.[selWeek]?.[exec.id]||{};
      const autoKpis={};
      Object.entries(kpiMap).forEach(([k,v])=>{if(v!=null)autoKpis[k]=String(isNaN(+v)?v:+(+v).toFixed(1));});
      const autoBonos={};
      Object.entries(bonoMap).forEach(([i,v])=>{if(v!=null)autoBonos[i]=String(isNaN(+v)?v:+(+v).toFixed(1));});
      nd={...nd,weeks:{...nd.weeks,[selWeek]:{...(nd.weeks?.[selWeek]||{}),[exec.id]:{
        ...existing,
        kpis:{...(existing.kpis||{}),...autoKpis},
        bonos:{...(existing.bonos||{}),...autoBonos},
        semana:parsed.semana,mes:parsed.mes,trim:existing.trim||"T3"
      }}}};
    });
    onImport(nd);
    setSyncMsg("✅ Indicadores de cartera sincronizados para "+selWeek);
    setTimeout(()=>setSyncMsg(null),4000);
  };

  return(
    <div style={{padding:"18px 22px"}}>

      

      {/* ── ACTUALIZACIÓN DE INDICADORES DE CARTERA ── */}
      <div style={{background:"#fff",borderRadius:10,border:"1.5px solid "+P.cbd,
        overflow:"hidden",marginBottom:16,boxShadow:"0 1px 5px rgba(10,40,90,.07)"}}>
        <div style={{background:"#7C3AED",padding:"9px 16px",fontSize:10,fontWeight:800,
          color:"#fff",textTransform:"uppercase",letterSpacing:1}}>
          Actualizacion de Indicadores de Cartera
        </div>
        <div style={{padding:"12px 16px",display:"flex",alignItems:"center",gap:12,flexWrap:"wrap"}}>
          <div style={{flex:1,fontSize:11,color:P.textMd,lineHeight:1.5,minWidth:220}}>
            Descarga la plantilla con todos los clientes, actualiza la facturacion y paquetes 2026
            y subela diariamente. El sistema recalculara Retencion, Crecimiento y Lealtad DT automaticamente.
          </div>
          <div style={{display:"flex",gap:8,flexShrink:0}}>
            <button onClick={handleMatDownload}
              style={{padding:"8px 16px",background:"#F47920",color:"#fff",border:"none",
                borderRadius:8,fontSize:11,fontWeight:700,cursor:"pointer"}}>
              📋 Descargar Plantilla
            </button>
            <button onClick={handleMatUpload} disabled={matLoading}
              style={{padding:"8px 16px",color:"#fff",border:"none",borderRadius:8,fontSize:11,
                fontWeight:700,cursor:matLoading?"default":"pointer",
                background:matLoading?"#94A3B8":"#7C3AED"}}>
              {matLoading?"Procesando...":"📤 Subir Actualizacion"}
            </button>
          </div>
          {matMsg&&(
            <div style={{width:"100%",marginTop:4,padding:"8px 12px",borderRadius:7,fontSize:11,fontWeight:600,
              background:matMsg.type==="success"?P.lgBg:P.lrBg,
              color:matMsg.type==="success"?P.green:P.red,
              border:"1px solid "+(matMsg.type==="success"?"#86EFAC":"#FCA5A5")}}>
              {matMsg.text}
            </div>
          )}
        </div>
      </div>

      {/* Controls */}
      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:16,flexWrap:"wrap"}}>
        <span style={{fontSize:11,fontWeight:700,color:P.textMd}}>Semana:</span>
        <select value={selWeek} onChange={e=>setSelWeek(e.target.value)}
          style={{padding:"6px 12px",borderRadius:7,border:"1.5px solid "+P.cbd,fontSize:12,fontWeight:600,color:P.textDk,background:"#fff",outline:"none"}}>
          {allWeeks.length===0&&<option value="">Sin datos</option>}
          {allWeeks.map(w=><option key={w} value={w}>{w}</option>)}
        </select>

        {/* Ver historial de: */}
        <span style={{fontSize:11,fontWeight:700,color:P.textMd,marginLeft:8}}>Ver historial de:</span>
        <select value={histExec||""} onChange={e=>setHistExec(e.target.value||null)}
          style={{padding:"6px 12px",borderRadius:7,border:"1.5px solid "+P.cbd,fontSize:12,color:P.textDk,background:"#fff",outline:"none"}}>
          <option value="">— Todos (semana) —</option>
          {team.map(e=><option key={e.id} value={e.id}>{e.name}</option>)}
        </select>

        {allWeeks.length>0&&!histExec&&(
          <div style={{marginLeft:"auto",display:"flex",gap:8,flexWrap:"wrap"}}>
            {window.__MATRIX__&&selWeek&&(
              <button onClick={handleSyncMatrix}
                style={{display:"flex",alignItems:"center",gap:7,padding:"8px 14px",
                  background:"#7C3AED",color:"#fff",border:"none",borderRadius:8,fontSize:11,fontWeight:700}}>
                🔄 Sincronizar Indicadores
              </button>
            )}
            <button onClick={()=>downloadComparativoExcel(db)}
              style={{display:"flex",alignItems:"center",gap:7,padding:"8px 14px",
                background:"#15803D",color:"#fff",border:"none",borderRadius:8,fontSize:11,fontWeight:700}}>
              📊 Descargar Excel
            </button>
            <button onClick={onGenXLS} disabled={genXLS}
              style={{display:"flex",alignItems:"center",gap:7,padding:"8px 14px",background:genXLS?"#94A3B8":"#15803D",color:"#fff",border:"none",borderRadius:8,fontSize:11,fontWeight:700}}>
              {genXLS?"⏳":"📊"} Excel
            </button>
            <button onClick={onGenPPT} disabled={generating}
              style={{display:"flex",alignItems:"center",gap:7,padding:"8px 14px",background:generating?"#94A3B8":"#1A56A0",color:"#fff",border:"none",borderRadius:8,fontSize:11,fontWeight:700}}>
              {generating?"⏳":"📥"} PowerPoint
            </button>
          </div>
        )}
        {syncMsg&&<div style={{width:"100%",marginTop:6,padding:"7px 12px",borderRadius:7,fontSize:11,fontWeight:600,background:P.lgBg,color:P.green,border:"1px solid #86EFAC"}}>{syncMsg}</div>}
      </div>

      {/* HISTORIAL DE UN EJECUTIVO */}
      {histExec&&(()=>{
        const exec=team.find(e=>e.id===histExec);
        if(!exec)return null;
        return <ExecHistorial exec={exec} db={db}/>;
      })()}

      {/* TABLA DEL EQUIPO (semana) */}
      {!histExec&&allWeeks.length>0&&(
        <div style={{overflowX:"auto"}}>
          <table style={{width:"100%",borderCollapse:"collapse",background:"#fff",borderRadius:10,overflow:"hidden",boxShadow:"0 2px 8px rgba(10,40,90,.08)"}}>
            <thead>
              <tr>
                <th style={{background:P.dark,padding:"10px 14px",textAlign:"left",fontSize:10,fontWeight:700,color:"#fff",minWidth:160}}>Ejecutivo</th>
                <th style={{background:P.dark,padding:"10px",textAlign:"center",fontSize:10,fontWeight:700,color:"#fff",minWidth:80}}>Rol</th>
                {["KPI 01","KPI 02","KPI 03","KPI 04","KPI 05","KPI 06","KPI 07"].map(k=>(
                  <th key={k} style={{background:P.dark,padding:"10px 8px",textAlign:"center",fontSize:9,fontWeight:700,color:"rgba(255,255,255,.6)",minWidth:72}}>{k}</th>
                ))}
                <th style={{background:"#F47920",padding:"10px 12px",textAlign:"center",fontSize:10,fontWeight:800,color:"#fff",minWidth:100}}>AVANCE GRAL.</th>
              </tr>
            </thead>
            <tbody>
              {team.map((exec,idx)=>{
                const roleKpis=ROLES[exec.role].kpis,roleColor=ROLE_COLOR[exec.role];
                const wd=(weekData[exec.id])||{};
                const kpiVals=wd.kpis||{};
                const pcts=roleKpis.map(k=>calcPct(kpiVals[k.id]||"",k));
                const wps=pcts.filter(p=>p>0);
                const avg=wps.length?wps.reduce((a,b)=>a+b,0)/wps.length:0;
                const rbg=idx%2===0?"#fff":P.bgl;
                return(<tr key={exec.id}>
                  <td style={{padding:"10px 14px",borderBottom:"1px solid "+P.cbd,background:rbg}}>
                    <div style={{display:"flex",alignItems:"center",gap:8}}>
                      <div style={{width:30,height:30,borderRadius:"50%",background:roleColor,display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:800,color:"#fff",flexShrink:0}}>{exec.id}</div>
                      <div><div style={{fontSize:11,fontWeight:700,color:P.textDk}}>{exec.name}</div><div style={{fontSize:9,color:P.textMd}}>{exec.role}</div></div>
                    </div>
                  </td>
                  <td style={{padding:"8px",textAlign:"center",borderBottom:"1px solid "+P.cbd,background:rbg}}>
                    <span style={{padding:"3px 10px",borderRadius:20,background:ROLE_LIGHT[exec.role],color:roleColor,fontSize:9,fontWeight:700}}>{exec.role}</span>
                  </td>
                  {[0,1,2,3,4,5,6].map(i=>{
                    const kpi=roleKpis[i];
                    if(!kpi)return(<td key={i} style={{padding:"8px",textAlign:"center",borderBottom:"1px solid "+P.cbd,background:rbg}}><span style={{fontSize:10,color:P.cbd}}>—</span></td>);
                    const pct=pcts[i],col=barColor(pct);
                    const cellBg=pct>=100?P.lgBg:pct>=75?P.laBg:pct>0?P.lrBg:rbg;
                    return(<td key={i} style={{padding:"8px",textAlign:"center",borderBottom:"1px solid "+P.cbd,background:cellBg}}>
                      <div style={{fontSize:12,fontWeight:800,color:pct>0?col:P.textMd}}>{pctLbl(pct)}</div>
                      <div style={{width:50,margin:"3px auto 0"}}><Bar pct={pct} thin/></div>
                      <div style={{fontSize:7.5,color:P.textMd,marginTop:2}}>{kpi.name}</div>
                    </td>);
                  })}
                  <td style={{padding:"10px 12px",textAlign:"center",borderBottom:"1px solid "+P.cbd,background:avg>=100?P.lgBg:avg>=75?P.laBg:avg>0?P.lrBg:rbg}}>
                    <div style={{fontSize:18,fontWeight:800,color:barColor(avg)}}>{pctLbl(avg)}</div>
                    <div style={{marginTop:4}}><Bar pct={avg} thin/></div>
                  </td>
                </tr>);
              })}
            </tbody>
          </table>
        </div>
      )}
      {!histExec&&allWeeks.length===0&&(
        <div style={{textAlign:"center",padding:40,color:P.textMd,fontSize:12}}>Sin datos guardados aún.</div>
      )}

      {/* ── CLIENTES NUEVOS — Ventas Nuevas del Equipo ── */}
            {!histExec&&<ViewPresupuestoEquipo team={team}/>}

      {!histExec&&(()=>{
        const rows=team.map(exec=>{
          const ventas=(db.ventasNuevas||[]).filter(v=>v.ejecutivoId===exec.id);
          const cnt=ventas.length;
          const jul=ventas.reduce((s,v)=>s+(v.jul26||0),0);
          const ago=ventas.reduce((s,v)=>s+(v.ago26||0),0);
          const sep=ventas.reduce((s,v)=>s+(v.sep26||0),0);
          const tot=jul+ago+sep;
          const meta={Hunter:12,Televentas:9}[exec.role]||null;
          const ok=meta!=null?cnt>=meta:null;
          return{exec,cnt,jul,ago,sep,tot,meta,ok};
        });
        const hasAny=rows.some(r=>r.cnt>0);
        return(
          

      <div style={{marginTop:28}}>
            <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:10}}>
              <div style={{fontSize:13,fontWeight:700,color:P.textDk}}>💼 Clientes Nuevos — Ventas Registradas Q3 2026</div>
              <div style={{fontSize:10,color:P.textMd}}>Capturados por cada ejecutivo en su tab de Ventas Nuevas</div>
            </div>
            <div style={{overflowX:"auto"}}>
              <table style={{width:"100%",borderCollapse:"collapse",background:"#fff",borderRadius:10,overflow:"hidden",boxShadow:"0 2px 8px rgba(10,40,90,.08)"}}>
                <thead>
                  <tr>
                    <th style={{background:P.dark,padding:"9px 14px",textAlign:"left",fontSize:10,fontWeight:700,color:"#fff",minWidth:160}}>Ejecutivo</th>
                    <th style={{background:P.dark,padding:"9px 10px",textAlign:"center",fontSize:10,fontWeight:700,color:"#fff",minWidth:80}}>Rol</th>

     "Bono 1","Bono 2","Bono 3","Cliente 1","Cliente 2","Cliente 3","Compromiso 1","Compromiso 2","Compromiso 3"],
  ];

  ws1["!merges"]=[{s:{r:0,c:0},e:{r:0,c:18}}];
  XLSX.utils.book_append_sheet(wb,ws1,"Datos");
  // Hoja 2: Referencia KPIs
  const ref=[["REFERENCIA DE KPIs POR ROL"],[]];
  ref.push(["Rol","KPI 01","KPI 02","KPI 03","KPI 04","KPI 05","KPI 06","KPI 07"]);
  Object.entries(ROLES).forEach(([role,rd])=>{
    ref.push([role,...rd.kpis.map(k=>k.name+" (Meta: "+fmtMeta(k)+")"),...Array(7-rd.kpis.length).fill("\u2014")]);
  });
  ref.push([],["REFERENCIA DE BONOS"],["Rol","Bono 1","Bono 2","Bono 3"]);
  Object.entries(ROLES).forEach(([role,rd])=>{
    const mf=b=>b.isCurrency?"$"+b.meta.toLocaleString("es-MX"):(b.isInverse?"<":"\u2265")+" "+b.meta+b.suffix;

  XLSX.writeFile(wb,"Plantilla_Afimex_Semanal.xlsx");

function importTemplate(file,db,onSuccess,onError){
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const wb=XLSX.read(e.target.result,{type:"binary"});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:""});
      const semana=String((rows[2]||[])[1]||"").trim();
      const mes   =String((rows[2]||[])[3]||"").trim();
      const trim  =String((rows[2]||[])[5]||"").trim();
      if(!semana||!mes){onError("No se encontr\u00f3 Semana o Mes \u2014 verifica el archivo.");return;}
      const weekKey="Sem "+semana+" \u00b7 "+mes;
      const dataRows=rows.slice(6).filter(r=>r[0]); // after header row at index 5
      if(!dataRows.length){onError("No se encontraron datos de ejecutivos.");return;}
      const newWeekData={...((db.weeks&&db.weeks[weekKey])||{})};
      let count=0;
      dataRows.forEach(row=>{
        const execId=String(row[0]).trim();
        const exec=db.team.find(e=>e.id===execId);
        if(!exec)return;
        const kpis=ROLES[exec.role].kpis;
        const bonos=ROLES[exec.role].bonos;
        const kpiVals={};
        kpis.forEach((kpi,i)=>{const v=row[3+i];if(v!==null&&v!==undefined&&v!=="")kpiVals[kpi.id]=String(v);});
        const bonoVals={};
        bonos.forEach((b,i)=>{const v=row[10+i];if(v!==null&&v!==undefined&&v!=="")bonoVals[i]=String(v);});
        const clts=[String(row[13]||""),String(row[14]||""),String(row[15]||"")];
        const comps=[String(row[16]||""),String(row[17]||""),String(row[18]||"")];
        newWeekData[execId]={kpis:kpiVals,bonos:bonoVals,clientes:clts,compromisos:comps,semana,mes,trim};
        count++;
      });
      onSuccess({...db,weeks:{...db.weeks,[weekKey]:newWeekData}},weekKey,count);
    }catch(err){onError("Error al leer el archivo: "+err.message);}
  };
  reader.readAsBinaryString(file);
}

function generateExcel(db,compWeek){
  const wb=XLSX.utils.book_new();
  const kpiHdrs=["KPI 01","KPI 02","KPI 03","KPI 04","KPI 05","KPI 06","KPI 07"];
  const weekData=(db.weeks&&db.weeks[compWeek])||{};
  const sumRows=[[`REPORTE SEMANAL — ${compWeek}`],[`Generado: ${new Date().toLocaleDateString("es-MX")}`],[],["Ejecutivo","Rol",...kpiHdrs,"Avance General","Estado"]];
  db.team.forEach(exec=>{
    const kpis=ROLES[exec.role].kpis,vals=(weekData[exec.id]&&weekData[exec.id].kpis)||{};
    const row=[exec.name,exec.role];
    for(let i=0;i<7;i++){const kpi=kpis[i];if(!kpi){row.push("—");continue;}const pct=calcPct(vals[kpi.id]||"",kpi);row.push(pct>0?(fmtReal(vals[kpi.id],kpi)+" | "+Math.round(pct)+"%"):"—");}
    const avg=calcAvg(kpis,vals);row.push(avg>0?Math.round(avg)+"%":"—");row.push(statusLbl(avg));
    sumRows.push(row);
  });
  const ws1=XLSX.utils.aoa_to_sheet(sumRows);XLSX.utils.book_append_sheet(wb,ws1,"Resumen");
  const histRows=[["Semana","Ejecutivo","Rol",...kpiHdrs.map(k=>k+" Real"),...kpiHdrs.map(k=>k+" Avance"),"Avance General"]];
  Object.keys(db.weeks||{}).sort().forEach(week=>{db.team.forEach(exec=>{const ed=db.weeks[week]&&db.weeks[week][exec.id];if(!ed)return;const kpis=ROLES[exec.role].kpis,vals=ed.kpis||{};const reals=Array(7).fill("—"),avcs=Array(7).fill("—");kpis.forEach((k,i)=>{if(vals[k.id]){reals[i]=fmtReal(vals[k.id],k);avcs[i]=Math.round(calcPct(vals[k.id],k))+"%";}});const avg=calcAvg(kpis,vals);histRows.push([week,exec.name,exec.role,...reals,...avcs,avg>0?Math.round(avg)+"%":"—"]);});});
  const ws2=XLSX.utils.aoa_to_sheet(histRows);XLSX.utils.book_append_sheet(wb,ws2,"Historico");
  XLSX.writeFile(wb,"Afimex_Avances_"+compWeek.replace(/[^a-zA-Z0-9]/g,"_")+".xlsx");
}

/* ═══════════════════════════════════════════════════════════════
   INDICADORES DE CARTERA — helpers y componentes
   ═══════════════════════════════════════════════════════════════ */
const fmtPeso = v => v?'$'+Math.round(v).toLocaleString('es-MX'):'—';
const fmtPaq  = v => v!=null&&v>0?Math.round(v).toLocaleString('es-MX'):'—';
const fmtDiff = v => v!=null ? (v>=0?'+':'')+v.toFixed(1)+'%' : '—';
const diffCol = v => v==null?P.textMd:v>=0?P.green:P.red;

function MetricCard({label,value,meta,isInverse,unit,note,roleColor}){
  const ok = isInverse ? value<=meta : value>=meta;
  const col = ok ? P.green : P.red;
  const bg  = ok ? P.lgBg  : P.lrBg;
  return(
    <div style={{background:bg,borderRadius:10,border:'2px solid '+(ok?'#86EFAC':'#FCA5A5'),
      padding:'14px 18px',flex:1,minWidth:180}}>
      <div style={{fontSize:11,fontWeight:700,color:P.textMd,marginBottom:6,textTransform:'uppercase',letterSpacing:.5}}>{label}</div>
      <div style={{fontSize:38,fontWeight:800,color:col,lineHeight:1}}>{value}{unit}</div>
      <div style={{fontSize:11,fontWeight:600,color:col,marginTop:4}}>
        {ok?'✅ En meta':'🔴 Por debajo'} — Meta: {isInverse?'<':'≥'} {meta}{unit}
      </div>
      {note&&<div style={{fontSize:10,color:P.textMd,marginTop:4,fontStyle:'italic'}}>{note}</div>}
    </div>
  );
}

function TableMatrix({rows,cols,pageSize=30}){
  const [q,setQ]=useState('');
  const [pg,setPg]=useState(0);
  const filtered=rows.filter(r=>!q||r[0].toLowerCase().includes(q.toLowerCase()));
  const total=filtered.length;
  const pages=Math.ceil(total/pageSize);
  const visible=filtered.slice(pg*pageSize,(pg+1)*pageSize);
  return(
    <div>
      <div style={{display:'flex',gap:10,marginBottom:10,alignItems:'center'}}>
        <input value={q} onChange={e=>{setQ(e.target.value);setPg(0);}}
          placeholder="🔍 Buscar cliente..."
          style={{flex:1,padding:'7px 12px',fontSize:12,border:'1.5px solid '+P.cbd,borderRadius:7,outline:'none'}}/>
        <span style={{fontSize:11,color:P.textMd}}>{total} cliente{total!==1?'s':''}</span>
      </div>
      <div style={{overflowX:'auto'}}>
        <table style={{width:'100%',borderCollapse:'collapse',background:'#fff',borderRadius:10,overflow:'hidden',
          boxShadow:'0 1px 5px rgba(10,40,90,.07)',fontSize:11}}>
          <thead>
            <tr>{cols.map((c,i)=>(
              <th key={i} style={{background:P.dark,padding:'8px 10px',textAlign:i<2?'left':'center',
                fontWeight:700,color:'#fff',whiteSpace:'nowrap',fontSize:10}}>{c}</th>
            ))}</tr>
          </thead>
          <tbody>
            {visible.map((r,ri)=>(
              <tr key={ri} style={{background:ri%2===0?'#fff':P.bgl}}>
                {r.map((cell,ci)=>(
                  typeof cell==='object'&&cell!==null
                  ? <td key={ci} style={{padding:'7px 10px',borderBottom:'1px solid '+P.cbd,
                      textAlign:'center',fontWeight:700,color:cell.col,background:cell.bg||undefined}}>
                      {cell.v}
                    </td>
                  : <td key={ci} style={{padding:'7px 10px',borderBottom:'1px solid '+P.cbd,
                      textAlign:ci<2?'left':'center',maxWidth:ci===0?220:undefined,
                      overflow:'hidden',textOverflow:'ellipsis',whiteSpace:ci===0?'nowrap':undefined}}>
                      {cell}
                    </td>
                ))}
              </tr>
            ))}
            {visible.length===0&&(
              <tr><td colSpan={cols.length} style={{padding:24,textAlign:'center',color:P.textMd}}>Sin resultados</td></tr>
            )}
          </tbody>
        </table>
      </div>
      {pages>1&&(
        <div style={{display:'flex',gap:6,marginTop:10,justifyContent:'center'}}>
          <button onClick={()=>setPg(p=>Math.max(0,p-1))} disabled={pg===0}
            style={{padding:'4px 12px',borderRadius:6,border:'1px solid '+P.cbd,background:pg===0?P.bgl:'#fff',cursor:pg===0?'default':'pointer'}}>‹</button>
          <span style={{fontSize:11,color:P.textMd,lineHeight:'24px'}}>Página {pg+1} de {pages}</span>
          <button onClick={()=>setPg(p=>Math.min(pages-1,p+1))} disabled={pg===pages-1}
            style={{padding:'4px 12px',borderRadius:6,border:'1px solid '+P.cbd,background:pg===pages-1?P.bgl:'#fff',cursor:pg===pages-1?'default':'pointer'}}>›</button>
        </div>
      )}
    </div>
  );
}

/* ── Vista: Retención ──────────────────────────────────────── */
function ViewMatrixRet({execId,roleColor,meta}){
  const md=window.__MATRIX__&&window.__MATRIX__[execId];
  const [tab,setTab]=useState('base');
  if(!md)return <div style={{padding:24,color:P.textMd}}>Sin datos de cartera disponibles.</div>;
  const r=md.ret;
  const meses=md.meses.join('+');

  // Indicador: SOLO clientes con paq25 > 0 (base 2025)
  const base2025  = md.clientes.filter(c=>c.p25>0);          // base del indicador
  const retenidos = base2025.filter(c=>c.p26>0);              // retenidos
  const perdidos  = base2025.filter(c=>c.p26===0);            // perdidos
  const nuevos26  = md.clientes.filter(c=>c.p25===0&&c.p26>0); // nuevos 2026 (fuera del indicador)

  // Métricas recalculadas sobre base correcta
  const retCliPct = base2025.length ? +(retenidos.length/base2025.length*100).toFixed(1) : 0;
  const vol25base = base2025.reduce((s,c)=>s+c.p25,0);
  const vol26base = base2025.reduce((s,c)=>s+c.p26,0);
  const retVolPct = vol25base ? +(vol26base/vol25base*100).toFixed(1) : 0;
  // Jul↔Jul sobre base 2025
  const conJul25  = base2025.filter(c=>c.jp25>0);
  const retJulPct = conJul25.length && conJul25.reduce((s,c)=>s+c.jp25,0)>0
    ? +(conJul25.reduce((s,c)=>s+c.jp26,0)/conJul25.reduce((s,c)=>s+c.jp25,0)*100).toFixed(1) : 0;

  const sets={base:base2025, retenidos, perdidos, nuevos26};
  const cur=sets[tab]||base2025;
  const isNuevos = tab==='nuevos26';

  // Alcance mes: jp26/jp25*100 solo si jp25>0
  const alcanceMes = c => c.jp25>0 && c.jp26!=null
    ? +(c.jp26/c.jp25*100).toFixed(1) : null;

  const tabRows=cur.map(c=>{
    const alc = alcanceMes(c);
    return [
      c.nom,
      c.tp,
      {v:fmtPaq(c.p25),col:P.textDk},
      {v:fmtPaq(c.p26),col:P.textDk},  // Paq Q3 2026 acum (después de Q3 2025)
      // Alcance Q3: paq26/paq25
      c.p25>0&&c.p26>0 ? {v:fmtDiff(c.cpq),col:diffCol(c.cpq),bg:c.cpq>=0?P.lgBg:P.lrBg}
        : c.prd ? {v:'Perdido',col:P.red,bg:P.lrBg}
        : isNuevos ? {v:'Nuevo 2026',col:'#2563EB',bg:'#EFF6FF'}
        : {v:'—',col:P.textMd},
      // Paq Jul 2025
      {v:fmtPaq(c.jp25),col:P.textMd},
      // Paq Jul 2026
      {v:fmtPaq(c.jp26),col:P.textMd},
      // % Alcance mes actual (Jul↔Jul)
      alc!=null ? {v:alc.toFixed(1)+'%',col:diffCol(alc-100),bg:alc>=100?P.lgBg:alc>=80?P.laBg:P.lrBg}
        : isNuevos ? {v:'Nuevo',col:'#2563EB'} : {v:'—',col:P.textMd},
    ];
  });

  return(
    <div style={{padding:'16px 22px'}}>
      <div style={{fontSize:10,color:P.textMd,marginBottom:14,fontStyle:'italic'}}>
        📅 Q3 2025 (Jul+Ago+Sep) vs {meses} 2026 — Indicador calculado sobre clientes con paquetes en 2025. Nuevos 2026 se muestran aparte.
      </div>

      {/* Metric cards */}
      <div style={{display:'flex',gap:12,marginBottom:18,flexWrap:'wrap'}}>
        <MetricCard label="Retención de Clientes" value={retCliPct} meta={meta} isInverse={false} unit="%" roleColor={roleColor}
          note={`${retenidos.length} de ${base2025.length} clientes 2025 activos en 2026`}/>
        <MetricCard label="Alcance de Volumen Jul↔Jul" value={retJulPct} meta={meta} isInverse={false} unit="%" roleColor={roleColor}
          note="Julio 2025 vs Julio 2026 — mismo mes"/>
        <div style={{background:'#fff',borderRadius:10,border:'1.5px solid '+P.cbd,padding:'14px 18px',flex:1,minWidth:180}}>
          <div style={{fontSize:11,fontWeight:700,color:P.textMd,marginBottom:8,textTransform:'uppercase',letterSpacing:.5}}>Resumen base 2025</div>
          {[['Retenidos',retenidos.length,P.green],['Perdidos',perdidos.length,P.red],['Nuevos 2026 (no incluidos)',nuevos26.length,'#2563EB']].map(([lbl,val,col])=>(

function generateVentasTemplate(db){
  const wb=XLSX.utils.book_new();
  const aoa=[
    ["VENTAS NUEVAS Q3 2026 \u2014 Afimex Log\u00edstica & Paqueter\u00eda"],
    [],
    ["INSTRUCCIONES: Registra cada cliente nuevo. Usa el ID Ejecutivo de la hoja 'Ejecutivos'. No modifiques la fila de encabezados."],
    [],
    ["N\u00b0 Cliente","Raz\u00f3n Social","Ejecutivo (referencia)","ID Ejecutivo","Modalidad","% Descuento","Jul 2026","Ago 2026","Sep 2026"],
    ...((db.ventasNuevas||[]).map(v=>{
      const en=db.team.find(e=>e.id===v.ejecutivoId||e.id.toUpperCase()===v.ejecutivoId.toUpperCase());
      return[v.numCliente,v.razonSocial,en?.name||'',v.ejecutivoId,v.modalidad,v.descuento,v.jul26||'',v.ago26||'',v.sep26||''];
    }))
  ];
  if((db.ventasNuevas||[]).length===0) aoa.push(["","","","","PREPAGO o CREDITO",0,0,0,0]);
  const ws1=XLSX.utils.aoa_to_sheet(aoa);
  ws1["!cols"]=[{wch:12},{wch:38},{wch:30},{wch:12},{wch:12},{wch:12},{wch:14},{wch:14},{wch:14}];
  ws1["!merges"]=[{s:{r:0,c:0},e:{r:0,c:8}}];
  XLSX.utils.book_append_sheet(wb,ws1,"Ventas Nuevas");
  // Hoja referencia ejecutivos
  const ref=[["REFERENCIA \u2014 IDs de Ejecutivos"],[],["ID","Nombre","Rol"],
    ...db.team.map(e=>[e.id,e.name,e.role])
  ];
  const ws2=XLSX.utils.aoa_to_sheet(ref);
  ws2["!cols"]=[{wch:8},{wch:35},{wch:14}];
  XLSX.utils.book_append_sheet(wb,ws2,"Ejecutivos");
  XLSX.writeFile(wb,"Ventas_Nuevas_Q3_2026.xlsx");
}

function importVentasTemplate(file,db,onSuccess,onError){
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const wb=XLSX.read(e.target.result,{type:"binary"});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:""});
      // Data starts at row index 5 (after title, blank, instructions, blank, headers)
      const dataRows=rows.slice(5).filter(r=>(r[0]||r[1])&&r[3]);
      if(!dataRows.length){onError("No se encontraron datos. Verifica que el archivo sea la plantilla correcta.");return;}
      // Normalizar ID ejecutivo: trim + uppercase para tolerar variaciones
      const normExecId=raw=>{
        const s=String(raw||"").trim().toUpperCase();
        // Buscar coincidencia exacta o aproximada en el equipo
        const exact=db.team.find(e=>e.id===s);
        if(exact)return s;
        // Fallback: buscar por nombre en col C (índice 2)
        return s;
      };
      // Descuento: Excel puede guardar % como decimal (0.25 = 25%)
      const normDesc=raw=>{
        const v=parseFloat(raw)||0;
        // Si está entre 0 y 1 (excl.) es decimal → convertir a %
        return(v>0&&v<1)?Math.round(v*1000)/10:Math.round(v*10)/10;
      };
      const ventas=dataRows.map(row=>({
        numCliente: String(row[0]||"").trim(),
        razonSocial: String(row[1]||"").trim(),
        ejecutivoId: normExecId(row[3]),
        modalidad:   String(row[4]||"PREPAGO").trim().toUpperCase(),
        descuento:   normDesc(row[5]),
        jul26:       parseFloat(row[6])||0,
        ago26:       parseFloat(row[7])||0,
        sep26:       parseFloat(row[8])||0,
      })).filter(v=>v.razonSocial&&v.ejecutivoId);
      onSuccess({...db,ventasNuevas:ventas},ventas.length);
    }catch(err){onError("Error al leer el archivo: "+err.message);}
  };
  reader.readAsBinaryString(file);
}

function generateCarteraTemplate(db){
  const wb=XLSX.utils.book_new();
  const hdrs=["ID Ejecutivo","Nombre Ejecutivo","No. Cliente","Razon Social",
    "Modalidad","Presupuesto Q3 2026 ($)","Facturacion Real Q3 2026 ($)","Alcance % (calculado)"];
  const cartera=db.cartera||[];
  // Pre-fill existing data, or empty rows per exec if no data
  const rows=[
    ["CARTERA DE CLIENTES — Q3 2026 — Afimex Logistica & Paqueteria"],
    ["Modalidades: PREPAGO / CREDITO / CONTRATO. El % Alcance se calcula automaticamente."],
    [],
    hdrs,
  ];
  if(cartera.length>0){
    cartera.forEach(c=>{
      const en=db.team.find(e=>e.id===c.ejecutivoId);
      const pct=c.presupuesto>0?Math.round(c.factReal/c.presupuesto*1000)/10:0;
      rows.push([c.ejecutivoId,en?.name||"",c.numCliente,c.razonSocial,c.modalidad,c.presupuesto,c.factReal,pct+"%"]);
    });
  } else {
    // Provide one empty row per exec as guide
    db.team.forEach(e=>{
      rows.push([e.id,e.name,"","","PREPAGO",0,0,"0%"]);
    });
  }
  const ws=XLSX.utils.aoa_to_sheet(rows);
  ws["!cols"]=[{wch:12},{wch:28},{wch:12},{wch:35},{wch:12},{wch:20},{wch:22},{wch:16}];
  ws["!merges"]=[{s:{r:0,c:0},e:{r:0,c:7}}];
  XLSX.utils.book_append_sheet(wb,ws,"Cartera");
  XLSX.writeFile(wb,"Cartera_Clientes_Q3_2026.xlsx");
}

function importCarteraTemplate(file,db,onSuccess,onError){
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const wb=XLSX.read(e.target.result,{type:"binary"});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:""});
      const dataRows=rows.slice(4).filter(r=>r[0]&&r[3]);
      if(!dataRows.length){onError("No se encontraron datos.");return;}
      const validIds=new Set(db.team.map(e=>e.id));
      const cartera=dataRows.map(row=>({
        ejecutivoId: String(row[0]||"").trim().toUpperCase(),
        numCliente:  String(row[2]||"").trim(),
        razonSocial: String(row[3]||"").trim(),
        modalidad:   String(row[4]||"PREPAGO").trim().toUpperCase(),
        presupuesto: parseFloat(row[5])||0,
        factReal:    parseFloat(row[6])||0,
      })).filter(c=>c.razonSocial&&validIds.has(c.ejecutivoId));
      if(!cartera.length){onError("Ningun ID de ejecutivo valido. Verifica la columna A.");return;}
      const newDb={...db,cartera};
      window.__CARTERA__=cartera;
      try{localStorage.setItem(STORE_KEY,JSON.stringify(newDb));}catch{}
      onSuccess(newDb,cartera.length);
    }catch(err){onError("Error: "+err.message);}
  };
  reader.readAsBinaryString(file);
}

/* ── Vista Cartera ── */
function importCartaraCompleta(file, onSuccess, onError){
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const wb=XLSX.read(e.target.result,{type:'binary'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
      // Skip header row(s): first row with actual data
      const headerRow=rows.findIndex(r=>r[0]&&String(r[0]).toLowerCase().includes('id'));
      const dataRows=rows.slice(headerRow>=0?headerRow+1:1).filter(r=>r[0]||r[2]);
      if(!dataRows.length){onError('No se encontraron datos.');return;}
      const lista=dataRows.map(row=>({
        claveEjec:  String(row[0]||'').trim().toUpperCase(),
        ejecutivo:  String(row[1]||'').trim(),
        nCliente:   String(row[2]||'').trim(),
        razonSocial:String(row[3]||'').trim(),
        modalidad:  String(row[4]||'PREPAGO').trim().toUpperCase(),
        estado:     String(row[5]||'').trim(),
        origenVenta:''
      })).filter(r=>r.nCliente||r.razonSocial);
      onSuccess(lista);
    }catch(err){onError('Error: '+err.message);}
  };
  reader.readAsBinaryString(file);
}

function downloadCartaraCompleta(lista){
  const ws=XLSX.utils.aoa_to_sheet([
    ['ID Ejecutivo','Nombre Ejecutivo','No. Cliente','Razón Social','Modalidad','Estado/Ubicación'],
    ...lista.map(r=>[r.claveEjec,r.ejecutivo,r.nCliente,r.razonSocial,r.modalidad,r.estado||''])
  ]);
  // Style header
  const range=XLSX.utils.decode_range(ws['!ref']);
  for(let c=range.s.c;c<=range.e.c;c++){
    const cell=XLSX.utils.encode_cell({r:0,c});
    if(!ws[cell])continue;
    ws[cell].s={font:{bold:true},fill:{fgColor:{rgb:"0C2B5E"}},alignment:{horizontal:'center'}};
  }
  ws['!cols']=[{wch:15},{wch:30},{wch:14},{wch:40},{wch:12},{wch:25}];
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'Cartera Equipo');
  XLSX.writeFile(wb,'Plantilla_Cartera_Equipo.xlsx');
}

function ViewCartera({execId,db,isDir,onSave}){
  const [filtExec,setFiltExec]=useState("");
  const [filtMod,setFiltMod]=useState("todas");
  const [importMsg,setImportMsg]=useState(null);
  const [ccMsg,setCcMsg]=useState(null);
  const [ccFiltExec,setCcFiltExec]=useState("");
  const [ccView,setCcView]=useState(false);

  const all=db.cartera||[];
  const base=isDir
    ?(filtExec?all.filter(c=>c.ejecutivoId===filtExec):all)
    :all.filter(c=>c.ejecutivoId===execId);
  const filtered=filtMod==="todas"?base:base.filter(c=>c.modalidad===filtMod);

  // Clientes activos por rol (de la cartera completa)
  const ccAll2=db.cartaraCompleta||[];
  const ccActive=isDir?ccAll2:ccAll2.filter(c=>c.claveEjec===execId);
  const byRoleCount={};
  db.team.forEach(e=>{
    byRoleCount[e.role]=(byRoleCount[e.role]||0);
  });
  ccActive.forEach(c=>{
    const ejec=db.team.find(e=>e.id===c.claveEjec);
    if(ejec)byRoleCount[ejec.role]=(byRoleCount[ejec.role]||0)+1;
  });

  const modalidades=[...new Set(all.map(c=>c.modalidad).filter(Boolean))];
  const execObj=db.team.find(e=>e.id===execId);
  const roleColor=ROLE_COLOR[execObj?.role]||"#1A56A0";

  const shareHTML=()=>{
    try{
      const cur=document.documentElement.outerHTML;
      const j=JSON.stringify(db.cartera||[]);
      const out=cur.replace(/window\.__CARTERA__=.*?\/\* CARTERA_DATA_(?:PLACEHOLDER|EMBEDDED) \*\//,
        'window.__CARTERA__='+j+'; /* CARTERA_DATA_EMBEDDED */');
      const a=document.createElement("a");
      a.href=URL.createObjectURL(new Blob([out],{type:"text/html"}));
      a.download="Tracker_Afimex_2026.html";a.click();
    }catch(e){alert("Error: "+e.message);}
  };

  const handleUpload=()=>{
    const inp=document.createElement("input");
    inp.type="file";inp.accept=".xlsx,.xls";
    inp.onchange=ev=>{
      if(!ev.target.files[0])return;
      setImportMsg({type:"loading",text:"Procesando..."});
      importCarteraTemplate(ev.target.files[0],db,(newDb,cnt)=>{
        onSave(newDb);

function MesCellPP({pp,real}){
  const alc=pp>0?+(real/pp*100).toFixed(1):null;
  const col=alc==null?P.textMd:alc>=100?P.green:alc>=75?P.amber:P.red;
  const bg =alc==null?"transparent":alc>=100?P.lgBg:alc>=75?P.laBg:P.lrBg;
  return(
    <td style={{padding:"8px 10px",borderBottom:"1px solid "+P.cbd,background:bg,textAlign:"center",minWidth:130}}>
      {pp>0?(
        <div>
          <div style={{fontSize:16,fontWeight:800,color:col,lineHeight:1}}>{alc!=null?alc.toFixed(1)+"%":"—"}</div>
          <div style={{width:60,margin:"3px auto 4px",height:5,background:P.fillBg,borderRadius:99,overflow:"hidden"}}>
            <div style={{height:"100%",width:Math.min(alc||0,100)+"%",background:col,borderRadius:99}}/>
          </div>
          <div style={{fontSize:8.5,color:P.textMd,lineHeight:1.4}}>
            <span style={{color:P.green,fontWeight:600}}>{fmtPeso(real)}</span>
            <span style={{color:P.textMd}}> / {fmtPeso(pp)}</span>
          </div>
        </div>
      ):(
        <span style={{fontSize:10,color:P.textMd}}>Sin ptto</span>
      )}
    </td>
  );
}

function ViewPresupuestoEquipo({team}){
  const mx=window.__MATRIX__||{};
  const rows=team.map(exec=>{
    const md=mx[exec.id];
    if(!md)return null;
    const cl=md.clientes;
    const ppjul=cl.reduce((s,c)=>s+(c.ppjul||0),0);
    const ppago=cl.reduce((s,c)=>s+(c.ppago||0),0);
    const ppsep=cl.reduce((s,c)=>s+(c.ppsep||0),0);
    const ppq3=ppjul+ppago+ppsep;
    if(ppq3===0)return null;
    const rjul=cl.reduce((s,c)=>s+(c.jf26||0),0);
    const rago=cl.reduce((s,c)=>s+(c.af26||0),0);
    const rsep=cl.reduce((s,c)=>s+(c.sf26||0),0);
    const rq3=rjul+rago+rsep;
    return{exec,ppjul,ppago,ppsep,ppq3,rjul,rago,rsep,rq3};
  }).filter(Boolean);

  if(!rows.length)return null;

  const tot={ppjul:0,ppago:0,ppsep:0,ppq3:0,rjul:0,rago:0,rsep:0,rq3:0};
  rows.forEach(r=>{
    tot.ppjul+=r.ppjul; tot.ppago+=r.ppago; tot.ppsep+=r.ppsep; tot.ppq3+=r.ppq3;
    tot.rjul+=r.rjul;   tot.rago+=r.rago;   tot.rsep+=r.rsep;   tot.rq3+=r.rq3;
  });

  const thBase={padding:"9px 10px",textAlign:"center",fontSize:9,fontWeight:700,color:"#fff"};
  const thDark={padding:"10px 14px",fontWeight:700,color:"#fff",fontSize:10};

  return(
    <div style={{marginTop:28,marginBottom:28}}>
