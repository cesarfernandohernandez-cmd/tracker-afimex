   ═══════════════════════════════════════════════════════════ */
function exportRetXLS(execId,execName,clientes,tab){
  const wb=XLSX.utils.book_new();
  const base=clientes.filter(c=>c.p25>0);
  const datasets={
    base:  {rows:base,           label:"Cartera 2025"},
    ret:   {rows:base.filter(c=>c.ret),  label:"Retenidos"},
    prd:   {rows:base.filter(c=>c.prd),  label:"Perdidos"},
    nw:    {rows:clientes.filter(c=>c.nw),label:"Nuevos 2026"},
  };
  const set=datasets[tab]||datasets.base;
  const hdrs=["No. Cliente","Razon Social","Tipo","Paq Q3 2025","Paq Q3 2026 Acum","Alcance Q3 %","Paq Jul 2025","Paq Jul 2026","Alcance Jul %","Status"];
  const aoa=[
    ["RETENCIÓN DE CARTERA — "+execName+" — "+set.label],
    ["Generado: "+new Date().toLocaleDateString("es-MX")],[],hdrs,
    ...set.rows.map(c=>{
      const alcQ3=c.p25>0&&c.p26>0?+(c.p26/c.p25*100).toFixed(1):null;
      const alcJul=c.jp25>0?+(c.jp26/c.jp25*100).toFixed(1):null;
      const status=c.ret?"Retenido":c.prd?"Perdido":c.nw?"Nuevo 2026":"—";
      return[c.n,c.nom,c.tp,c.p25,c.p26||0,alcQ3!=null?alcQ3+"%":"—",c.jp25,c.jp26||0,alcJul!=null?alcJul+"%":"—",status];
    })
  ];
  const ws=XLSX.utils.aoa_to_sheet(aoa);
  ws["!cols"]=[{wch:12},{wch:38},{wch:12},{wch:14},{wch:16},{wch:12},{wch:12},{wch:12},{wch:12},{wch:12}];
  XLSX.utils.book_append_sheet(wb,ws,"Retención");
  XLSX.writeFile(wb,"Retencion_"+execName.replace(/\s+/g,"_").slice(0,20)+"_"+tab+".xlsx");
}

function exportCrecXLS(execId,execName,clientes){
  const wb=XLSX.utils.book_new();
  const comp=clientes.filter(c=>c.cmp);
  const hdrs=["No. Cliente","Razon Social","Tipo","Fact Q3 2025","Fact Q3 2026 Acum","Alcance Q3 %","Fact Jul 2025","Fact Jul 2026","Alcance Jul %","Status"];
  const aoa=[
    ["CRECIMIENTO COMPARABLE — "+execName],
    ["Generado: "+new Date().toLocaleDateString("es-MX")],[],hdrs,
    ...comp.map(c=>{
      const alcQ3=c.f25>0&&c.f26>0?+(((c.f26-c.f25)/c.f25)*100).toFixed(1):null;
      const alcJul=c.jf25>0&&c.jf26>0?+(((c.jf26-c.jf25)/c.jf25)*100).toFixed(1):null;
      const status=c.dwn?"Down Trader":"Creciendo";
      return[c.n,c.nom,c.tp,c.f25,c.f26||0,alcQ3!=null?alcQ3+"%":"—",c.jf25,c.jf26||0,alcJul!=null?alcJul+"%":"—",status];
    })
  ];
  const ws=XLSX.utils.aoa_to_sheet(aoa);
  ws["!cols"]=[{wch:12},{wch:38},{wch:12},{wch:16},{wch:18},{wch:12},{wch:14},{wch:14},{wch:12},{wch:12}];
  XLSX.utils.book_append_sheet(wb,ws,"Crecimiento");
  XLSX.writeFile(wb,"Crecimiento_"+execName.replace(/\s+/g,"_").slice(0,20)+".xlsx");
}

/* ══════════════════════════════════════════════════════════════
   PRESUPUESTO — Clientes con presupuesto y facturación
   ══════════════════════════════════════════════════════════════ */
function ViewPresupuesto({execId,isDir,db}){
  const [filtExec,setFiltExec]=useState("");
  const [sortCol,setSortCol]=useState("jf26");

  const getClientesConPpto=()=>{
    const result=[];
    const execs=isDir?(filtExec?[db.team.find(e=>e.id===filtExec)].filter(Boolean):db.team):
                       [db.team.find(e=>e.id===execId)].filter(Boolean);
    execs.forEach(ex=>{
      const mx=window.__MATRIX__?.[ex.id];
      if(!mx||!mx.clientes)return;
      mx.clientes.forEach(c=>{
        if((c.ppjul||0)+(c.ppago||0)+(c.ppsep||0)>0){
          result.push({
            execId:ex.id,
            execName:ex.name,
            nCliente:c.n,
            razonSocial:c.nom,
            modalidad:c.tp,
            ppjul:c.ppjul||0,
            ppago:c.ppago||0,
            ppsep:c.ppsep||0,
            ppq3:(c.ppjul||0)+(c.ppago||0)+(c.ppsep||0),
            jf26:c.jf26||0,
            af26:c.af26||0,
            sf26:c.sf26||0,
            facAcum:(c.jf26||0)+(c.af26||0)+(c.sf26||0),
            alcJul:c.ppjul>0?Math.round((c.jf26||0)/c.ppjul*100):null,
            alcQ3:((c.ppjul||0)+(c.ppago||0)+(c.ppsep||0))>0?
              Math.round(((c.jf26||0)+(c.af26||0)+(c.sf26||0))/((c.ppjul||0)+(c.ppago||0)+(c.ppsep||0))*100):null
          });
        }
      });
    });
    result.sort((a,b)=>(b[sortCol]||0)-(a[sortCol]||0));
    return result;
  };

  const clientes=getClientesConPpto();
  const totPpJul=clientes.reduce((s,c)=>s+c.ppjul,0);
  const totJf26=clientes.reduce((s,c)=>s+c.jf26,0);
  const totPpQ3=clientes.reduce((s,c)=>s+c.ppq3,0);
  const totAcum=clientes.reduce((s,c)=>s+c.facAcum,0);
  const alcGlobalJul=totPpJul>0?Math.round(totJf26/totPpJul*100):0;
  const alcGlobalQ3=totPpQ3>0?Math.round(totAcum/totPpQ3*100):0;

  const alcColor=pct=>pct==null?"#6B7280":pct>=90?P.green:pct>=70?P.amber:P.red;

  const downloadPpto=()=>{
    const headers=['N° Cliente','Razón Social','Modalidad',
      isDir?'Ejecutivo':null,
      'Pp Jul','Fact Jul','Alc Jul %',
      'Pp Ago','Fact Ago',
      'Pp Sep','Fact Sep',
      'Pp Q3','Fact Acum Q3','Alc Q3 %'
    ].filter(Boolean);
    const rows=clientes.map(c=>[
      c.nCliente,c.razonSocial,c.modalidad,
      isDir?c.execName:null,
      c.ppjul,c.jf26,c.alcJul!=null?c.alcJul+'%':'—',
      c.ppago,c.af26,
      c.ppsep,c.sf26,
      c.ppq3,c.facAcum,c.alcQ3!=null?c.alcQ3+'%':'—'
    ].filter((_,i)=>isDir||i!==3));
    const ws=XLSX.utils.aoa_to_sheet([headers,...rows]);
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,'Presupuesto');
    XLSX.writeFile(wb,'Presupuesto_Afimex_2026.xlsx');
  };

  const SortBtn=({col,label})=>(
    <span onClick={()=>setSortCol(col)} style={{cursor:'pointer',
      color:sortCol===col?P.dark:'inherit',fontWeight:sortCol===col?800:'normal',
      borderBottom:sortCol===col?'2px solid #F47920':'none'}}>
      {label}{sortCol===col?' ↓':''}
    </span>
  );

  return(
    <div style={{padding:'16px 20px',maxWidth:1200,margin:'0 auto'}}>
      <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:16,flexWrap:'wrap'}}>
        <div style={{fontSize:14,fontWeight:700,color:P.dark}}>💰 Presupuesto vs Facturación Q3 2026</div>
        {isDir&&(
          <select value={filtExec} onChange={e=>setFiltExec(e.target.value)}
            style={{padding:'4px 8px',borderRadius:6,border:'1px solid '+P.cbd,fontSize:11}}>
            <option value="">Todos los ejecutivos</option>
            {db.team.map(t=>(<option key={t.id} value={t.id}>{t.name}</option>))}
          </select>
        )}
        <button onClick={downloadPpto}
          style={{padding:'6px 14px',background:'#15803D',color:'#fff',border:'none',borderRadius:7,fontSize:11,fontWeight:700,cursor:'pointer'}}>
          📥 Descargar Excel
        </button>
        <span style={{fontSize:11,color:P.textMd}}>{clientes.length} clientes con presupuesto</span>
      </div>

      {/* KPI cards */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(160px,1fr))',gap:10,marginBottom:16}}>
        {[
          {label:'Pp Julio',val:fmtPeso(totPpJul),sub:'presupuesto'},
          {label:'Fact Julio',val:fmtPeso(totJf26),sub:'facturado'},
          {label:'Alcance Julio',val:alcGlobalJul+'%',sub:'del presupuesto',color:alcColor(alcGlobalJul)},
          {label:'Pp Q3',val:fmtPeso(totPpQ3),sub:'presupuesto'},
          {label:'Fact Acum Q3',val:fmtPeso(totAcum),sub:'facturado'},
          {label:'Alcance Q3',val:alcGlobalQ3+'%',sub:'del presupuesto',color:alcColor(alcGlobalQ3)},
        ].map((k,i)=>(
          <div key={i} style={{background:'#fff',borderRadius:8,border:'1.5px solid '+P.cbd,padding:'10px 12px'}}>
            <div style={{fontSize:9,fontWeight:700,color:P.textMd,textTransform:'uppercase',letterSpacing:.5}}>{k.label}</div>
            <div style={{fontSize:16,fontWeight:800,color:k.color||P.dark,marginTop:2}}>{k.val}</div>
            <div style={{fontSize:9,color:P.textMd}}>{k.sub}</div>
          </div>
        ))}
      </div>

      {/* Table */}
      {clientes.length>0?(
        <div style={{overflowX:'auto',borderRadius:8,border:'1px solid '+P.cbd}}>
          <table style={{width:'100%',borderCollapse:'collapse',background:'#fff',fontSize:11}}>
            <thead>
              <tr style={{background:P.dark,color:'#fff'}}>
                <th style={{padding:'8px 10px',textAlign:'left',position:'sticky',left:0,background:P.dark}}>N° Cliente</th>
                <th style={{padding:'8px 10px',textAlign:'left'}}>Razón Social</th>
                {isDir&&<th style={{padding:'8px 10px',textAlign:'left'}}>Ejecutivo</th>}
                <th style={{padding:'8px 10px',textAlign:'right'}}><SortBtn col="ppjul" label="Pp Jul"/></th>
                <th style={{padding:'8px 10px',textAlign:'right'}}><SortBtn col="jf26" label="Fact Jul"/></th>
                <th style={{padding:'8px 10px',textAlign:'center'}}>Alc Jul %</th>
                <th style={{padding:'8px 10px',textAlign:'right'}}>Pp Ago</th>
                <th style={{padding:'8px 10px',textAlign:'right'}}>Fact Ago</th>
                <th style={{padding:'8px 10px',textAlign:'right'}}>Pp Sep</th>
                <th style={{padding:'8px 10px',textAlign:'right'}}>Fact Sep</th>
                <th style={{padding:'8px 10px',textAlign:'right'}}><SortBtn col="ppq3" label="Pp Q3"/></th>
                <th style={{padding:'8px 10px',textAlign:'right'}}><SortBtn col="facAcum" label="Fact Q3"/></th>
                <th style={{padding:'8px 10px',textAlign:'center'}}>Alc Q3 %</th>
              </tr>
            </thead>
            <tbody>
              {clientes.map((c,i)=>(
                <tr key={i} style={{borderBottom:'1px solid '+P.cbd,background:i%2===0?'#fff':'#F8FBFF'}}>
                  <td style={{padding:'6px 10px',position:'sticky',left:0,background:i%2===0?'#fff':'#F8FBFF'}}>{c.nCliente}</td>
                  <td style={{padding:'6px 10px',fontWeight:600,maxWidth:200}}>{c.razonSocial}</td>
                  {isDir&&<td style={{padding:'6px 10px',fontSize:10,color:P.textMd}}>{c.execName}</td>}
                  <td style={{padding:'6px 10px',textAlign:'right'}}>{fmtPeso(c.ppjul)}</td>
                  <td style={{padding:'6px 10px',textAlign:'right',fontWeight:700,color:P.dark}}>{fmtPeso(c.jf26)}</td>
                  <td style={{padding:'6px 10px',textAlign:'center'}}>
                    {c.alcJul!=null?(<span style={{background:alcColor(c.alcJul)+'22',color:alcColor(c.alcJul),
                      borderRadius:20,padding:'2px 8px',fontSize:10,fontWeight:700}}>{c.alcJul}%</span>):'—'}
                  </td>
                  <td style={{padding:'6px 10px',textAlign:'right'}}>{fmtPeso(c.ppago)}</td>
                  <td style={{padding:'6px 10px',textAlign:'right'}}>{fmtPeso(c.af26)}</td>
                  <td style={{padding:'6px 10px',textAlign:'right'}}>{fmtPeso(c.ppsep)}</td>
                  <td style={{padding:'6px 10px',textAlign:'right'}}>{fmtPeso(c.sf26)}</td>
                  <td style={{padding:'6px 10px',textAlign:'right',fontWeight:600}}>{fmtPeso(c.ppq3)}</td>
                  <td style={{padding:'6px 10px',textAlign:'right',fontWeight:700}}>{fmtPeso(c.facAcum)}</td>
                  <td style={{padding:'6px 10px',textAlign:'center'}}>
                    {c.alcQ3!=null?(<span style={{background:alcColor(c.alcQ3)+'22',color:alcColor(c.alcQ3),
                      borderRadius:20,padding:'2px 8px',fontSize:10,fontWeight:700}}>{c.alcQ3}%</span>):'—'}
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      ):(
        <div style={{padding:'40px',textAlign:'center',color:P.textMd,fontSize:12}}>
          No hay clientes con presupuesto registrado. Sube la plantilla de indicadores para ver los datos.
        </div>
      )}
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════
   HIGHLIGHTS — Plan de Acción con IA
   ═══════════════════════════════════════════════════════════ */
function ViewHighlights({execId,db,isDir}){
  const [selExecDir,setSelExecDir]=useState("");
  const [highlights,setHighlights]=useState(null);
  const [mode,setMode]=useState("individual");

  const effectiveExecId=isDir?(selExecDir||""):execId;
  const exec=db.team.find(e=>e.id===effectiveExecId);
  const roleColor=ROLE_COLOR[exec?.role]||"#1A56A0";

  const fmt=v=>v!=null?String(v):"—";
  const fmtN=v=>v>0?fmtPeso(v):"$0";
  const gap=(val,meta,inv)=>inv?(val<=meta?0:val-meta):(meta-val>0?meta-val:0);

  const generateExecPlan=(eid)=>{
    const execObj=db.team.find(e=>e.id===eid);
    if(!execObj)return null;
    const rol=execObj.role;
    const mx=window.__MATRIX__?.[eid];
    const ventas=(db.ventasNuevas||[]).filter(v=>v.ejecutivoId===eid);
    const cartera=(db.cartera||[]).filter(c=>c.ejecutivoId===eid);
    const allWeeks=Object.keys(db.weeks||{}).sort().reverse();
    const lastWeek=allWeeks[0];
    const lastData=lastWeek&&db.weeks[lastWeek]?.[eid];
    const kpis=ROLES[rol]?.kpis||[];
    const bonos=ROLES[rol]?.bonos||[];

    // Evaluar KPIs
    const kpiEval=kpis.map(k=>{
      const val=lastData?.kpis?.[k.id];
      const n=parseNum(val||"");
      const pct=val?calcPct(val,k):0;
      const enMeta=pct>=100;
      const critico=pct<75&&pct>0;
      const sinDato=!val;
      return{...k,val,n,pct,enMeta,critico,sinDato};
    });
    const enMeta=kpiEval.filter(k=>k.enMeta);
    const criticos=kpiEval.filter(k=>k.critico);
    const sinDato=kpiEval.filter(k=>k.sinDato);

    // Clientes riesgo desde matriz
    const clientesPerdidos=mx?mx.clientes.filter(c=>c.prd).slice(0,8):[];
    const clientesRiesgo=mx?mx.clientes.filter(c=>c.cmp&&c.f26<c.f25*0.7&&c.f26>0)
      .sort((a,b)=>(a.f26/a.f25)-(b.f26/b.f25)).slice(0,8):[];
    const downTraders=mx&&rol==="MAE"?mx.clientes.filter(c=>c.dwn).slice(0,8):[];
    const clientesCrec=mx?mx.clientes.filter(c=>c.p25>0&&c.p26>c.p25)
      .sort((a,b)=>(b.p26-b.p25)-(a.p26-a.p25)).slice(0,5):[];

    // Presupuesto
    const pttoTotal=cartera.reduce((s,c)=>s+(c.presupuesto||0),0);
    const realTotal=cartera.reduce((s,c)=>s+(c.factReal||0),0);
    const alcancePP=pttoTotal>0?Math.round(realTotal/pttoTotal*100):0;
    const clientesSinAlcance=cartera.filter(c=>c.presupuesto>0&&c.factReal<c.presupuesto*0.5).slice(0,5);

    // Ventas nuevas
    const vtTotal=ventas.reduce((s,v)=>s+(v.jul26||0)+(v.ago26||0)+(v.sep26||0),0);
    const vtSinFact=ventas.filter(v=>(v.jul26||0)+(v.ago26||0)+(v.sep26||0)===0);

    const fecha=new Date().toLocaleDateString("es-MX",{weekday:"long",year:"numeric",month:"long",day:"numeric"});
    let lines=[];

    lines.push("## HIGHLIGHTS — "+execObj.name+" | "+rol);
    lines.push("**Período:** Q3 2026  |  **Fecha:** "+fecha);
    lines.push("**Última semana capturada:** "+(lastWeek||"Sin datos"));
    lines.push("");

    // FORTALEZAS
    lines.push("### ✅ Fortalezas y Logros");
    if(enMeta.length>0){
      enMeta.forEach(k=>lines.push("- **"+k.name+"**: "+fmtReal(k.val,k)+" → "+Math.round(k.pct)+"% de avance (meta "+fmtMeta(k)+") ✅ En meta"));
    } else {
      lines.push("- Se mantiene actividad comercial en el período");
    }
    if(mx&&mx.ret?.n_retenidos>0) lines.push("- **Retención de cartera**: "+mx.ret.n_retenidos+" clientes activos mantenidos de "+mx.ret.n_base+" en 2025 ("+mx.ret.pct_clientes+"%)");
    if(ventas.length>0) lines.push("- **Ventas nuevas Q3**: "+ventas.length+" clientes incorporados por "+fmtPeso(vtTotal));
    if(enMeta.length===0&&mx==null&&ventas.length===0) lines.push("- Capturar información para evaluar avance");
    lines.push("");

    // CLIENTES EN RIESGO
    if(rol!=="Hunter"&&(clientesPerdidos.length>0||clientesRiesgo.length>0)){
      lines.push("### 🚨 Clientes en Riesgo — ATENCIÓN INMEDIATA");
      if(clientesPerdidos.length>0){
        lines.push("**Clientes PERDIDOS** (sin actividad en 2026 — recuperación urgente):");
        clientesPerdidos.forEach(c=>lines.push("- "+c.nom+" ("+c.tp+") — Llamada de rescate esta semana, evaluar oferta especial"));
      }
      if(clientesRiesgo.length>0){
        lines.push("");
        lines.push("**Clientes con CAÍDA SEVERA >30%** (requieren visita o llamada):");
        clientesRiesgo.forEach(c=>{
          const caida=(((c.f26-c.f25)/c.f25)*100).toFixed(0);
          lines.push("- "+c.nom+": facturación bajó "+caida+"% — Identificar causa: competencia/precio/servicio. Visita presencial recomendada");
        });
      }
      lines.push("");
    }

    // DOWN TRADERS MAE
    if(rol==="MAE"&&downTraders.length>0){
      lines.push("### 📉 Down Traders — Clientes que Redujeron Facturación");
      lines.push("Indicador actual: "+( mx?.leal?.pct||0)+"% (meta <15%)");
      downTraders.forEach(c=>{
        const caida=c.cft?c.cft.toFixed(1)+"% ":"";
        lines.push("- "+c.nom+": bajó "+caida+" — Revisar frecuencia de servicio y proponer plan de crecimiento");
      });
      lines.push("");
    }

    // HUNTER: PIPELINE Y BRECHAS
    if(rol==="Hunter"){
      lines.push("### 🎯 Estado del Pipeline — Hunter");
      const clNuevos=kpiEval.find(k=>k.id==="01");
      const factNueva=kpiEval.find(k=>k.id==="02");
      const opCRM=kpiEval.find(k=>k.id==="03");
      const closing=kpiEval.find(k=>k.id==="04");
      if(clNuevos) lines.push("- **Clientes nuevos**: "+fmt(clNuevos.val||0)+" de "+clNuevos.meta+" meta mensual ("+Math.round(clNuevos.pct)+"%)");
      if(factNueva) lines.push("- **Facturación nueva**: "+fmtReal(factNueva.val||"0",factNueva)+" de "+fmtMeta(factNueva)+" meta ("+Math.round(factNueva.pct)+"%)");
      if(opCRM) lines.push("- **Pipeline CRM**: "+fmt(opCRM.val||0)+" oportunidades activas de "+opCRM.meta+" meta");
      if(closing) lines.push("- **Closing ratio**: "+fmt(closing.val||0)+"% (meta ≥15%) — "+(parseNum(closing.val||"0")>=15?"✅ En meta":"🔴 Por debajo"));
      lines.push("");

      // Brechas vs bono
      lines.push("### 🚨 Brechas vs Bono Trimestral");
      const bonoClts=bonos[0];
      const bonoFact=bonos[1];
      if(bonoClts){
        const acumClts=lastData?.bonos?.[0]||0;
        const faltanClts=Math.max(0,bonoClts.meta-parseNum(acumClts));
        lines.push("- **Bono Clientes Nuevos**: "+fmt(acumClts)+" de "+bonoClts.meta+" (faltan "+faltanClts+" clientes para bono trimestral)");
      }
      if(bonoFact){
        const acumFact=lastData?.bonos?.[1]||0;
        const faltaFact=Math.max(0,bonoFact.meta-parseNum(acumFact));
        lines.push("- **Bono Facturación**: "+fmtPeso(parseNum(acumFact))+" de $300,000 (faltan "+fmtPeso(faltaFact)+" para bono)");
      }
      lines.push("");

      if(ventas.length>0){
        lines.push("### 📋 Seguimiento Cuentas Incorporadas");
        if(vtSinFact.length>0){
          lines.push("**Cuentas SIN facturación** en meses siguientes (activar urgente):");
          vtSinFact.forEach(v=>lines.push("- "+v.razonSocial+" ("+v.modalidad+") — Contactar para primer envío, revisar condiciones de descuento ("+v.descuento+"%)"));
        }
        const vtConFact=ventas.filter(v=>(v.jul26||0)+(v.ago26||0)+(v.sep26||0)>0);
        if(vtConFact.length>0){
          lines.push("**Cuentas CON facturación** (mantener y crecer):");
          vtConFact.slice(0,5).forEach(v=>{
            const tot=(v.jul26||0)+(v.ago26||0)+(v.sep26||0);
            lines.push("- "+v.razonSocial+": "+fmtPeso(tot)+" — Asegurar frecuencia, proponer ampliación de servicios");
          });
        }
        lines.push("");
      }
    }

    // OPORTUNIDADES DE CRECIMIENTO
    if(rol!=="Hunter"&&clientesCrec.length>0){
      lines.push("### 📈 Oportunidades de Crecimiento");
      lines.push("Clientes con **tendencia positiva** en volumen (capitalizar):");
      clientesCrec.forEach(c=>lines.push("- "+c.nom+": paquetes crecieron "+c.crecPaq+"% — Visita proactiva para ampliar contrato o aumentar frecuencia"));
      lines.push("");
    }

    // KPIs CRÍTICOS
    if(criticos.length>0){
      lines.push("### ⚠️ KPIs Críticos — Por debajo de meta");
      criticos.forEach(k=>{
        const g=gap(k.n,k.meta,k.isInverse);
        const accion=k.id==="03"||k.id==="06"?"Incrementar actividad en CRM, revisar pipeline"
          :k.isInverse?"Revisar proceso de cobranza, priorizar recuperación"
          :"Revisar estrategia y bloquear tiempo dedicado";
        lines.push("- **"+k.name+"**: "+fmtReal(k.val,k)+" (meta "+fmtMeta(k)+") — Brecha: "+fmt(g.toFixed(1))+k.suffix+" | Acción: "+accion);
      });
      lines.push("");
    }
    if(sinDato.length>0){
      lines.push("- **Sin captura**: "+sinDato.map(k=>k.name).join(", ")+" — Registrar datos esta semana para evaluar avance");
      lines.push("");
    }

    // PRESUPUESTO
    if(cartera.length>0&&pttoTotal>0){
      lines.push("### 💰 Avance vs Presupuesto");
      lines.push("- **Presupuesto Q3**: "+fmtPeso(pttoTotal)+" | **Real**: "+fmtPeso(realTotal)+" | **Alcance**: "+alcancePP+"%");
      if(clientesSinAlcance.length>0){
        lines.push("Clientes con alcance <50% de su presupuesto (prioridad):");
        clientesSinAlcance.forEach(c=>{
          const alc=c.presupuesto>0?Math.round(c.factReal/c.presupuesto*100):0;
          lines.push("- "+c.razonSocial+": "+alc+"% alcance ("+fmtPeso(c.factReal)+" de "+fmtPeso(c.presupuesto)+") — Revisar plan de acción con cliente");
        });
      }
      lines.push("");
    }

    // PLAN DE ACCIÓN
    lines.push("### 🎯 Plan de Acción — Próximas 2 Semanas");
    let acc=[];
    if(clientesPerdidos.length>0) acc.push("**Recuperación de clientes perdidos**: Contactar a "+clientesPerdidos.slice(0,3).map(c=>c.nom).join(", ")+" — Llamada de rescate + propuesta especial antes del viernes");
    if(clientesRiesgo.length>0) acc.push("**Atención a clientes en caída**: Visita o videollamada con "+clientesRiesgo.slice(0,2).map(c=>c.nom).join(", ")+" — Diagnóstico de causa y plan de recuperación");
    if(rol==="Hunter"&&vtSinFact.length>0) acc.push("**Activar cuentas nuevas sin facturación**: Llamar a "+vtSinFact.slice(0,3).map(v=>v.razonSocial).join(", ")+" — Coordinar primer envío esta semana");
    if(rol==="Hunter"&&kpiEval.find(k=>k.id==="03"&&!k.enMeta)) acc.push("**Ampliar pipeline CRM**: Prospectar mínimo 10 nuevos contactos del sector "+execObj.role+" — Meta: agregar al menos 5 oportunidades activas");
    if(criticos.length>0) acc.push("**Cerrar brecha en "+criticos[0].name+"**: De "+fmtReal(criticos[0].val,criticos[0])+" a "+fmtMeta(criticos[0])+" — Revisar táctica y bloquear tiempo en agenda");
    if(clientesCrec.length>0&&rol!=="Hunter") acc.push("**Crecer en cuentas con momentum**: Proponer ampliación a "+clientesCrec.slice(0,2).map(c=>c.nom).join(", ")+" — Upsell de servicios adicionales");
    if(cartera.length>0&&alcancePP<70) acc.push("**Alcance de presupuesto**: Revisar top 5 clientes con mayor brecha y acordar plan de activación para cerrar Q3");
    if(acc.length===0) acc.push("Capturar KPIs de la semana y actualizar CRM con oportunidades activas","Revisar pipeline y priorizar los 3 cierres más próximos","Contactar proactivamente a los 5 clientes más estratégicos de la cartera");
    acc.slice(0,4).forEach((a,i)=>lines.push((i+1)+". "+a));
    lines.push("");

    // COMPROMISOS
    lines.push("### 📋 Compromisos de Seguimiento");
    const hoy=new Date();
    const en7=new Date(hoy.getTime()+7*24*3600*1000).toLocaleDateString("es-MX");
    const en14=new Date(hoy.getTime()+14*24*3600*1000).toLocaleDateString("es-MX");
    if(clientesPerdidos.length>0) lines.push("- [ ] Llamadas de rescate a clientes perdidos — Fecha límite: "+en7);
    if(clientesRiesgo.length>0) lines.push("- [ ] Visita/llamada a clientes con caída severa — Fecha límite: "+en7);
    if(rol==="Hunter") lines.push("- [ ] Actualizar CRM con nuevas oportunidades — Fecha: "+en7);
    lines.push("- [ ] Registro de KPIs en el tracker — Cada semana");
    lines.push("- [ ] Revisión de avance con Dirección Comercial — "+en14);
    lines.push("");
    lines.push("---");
    lines.push("*Minuta de seguimiento generada automáticamente · Dirección Comercial Afimex · "+new Date().toLocaleDateString("es-MX")+"*");

    return lines.join("\n");
  };

  const generateResumen=()=>{
    const allWeeks=Object.keys(db.weeks||{}).sort().reverse();
    const lastWeek=allWeeks[0];
    const fecha=new Date().toLocaleDateString("es-MX",{weekday:"long",year:"numeric",month:"long",day:"numeric"});

    let lines=[];
    lines.push("## RESUMEN EJECUTIVO DEL EQUIPO — Afimex Q3 2026");
    lines.push("**Fecha:** "+fecha+"  |  **Semana:** "+(lastWeek||"Sin datos"));
    lines.push("");

    // Ranking del equipo
    const teamData=db.team.map(e=>{
      const wd=lastWeek&&db.weeks[lastWeek]?.[e.id];
      const kpis=ROLES[e.role]?.kpis||[];
      const kpisPcts=kpis.map(k=>{const val=wd?.kpis?.[k.id];return val?calcPct(val,k):0;});
      const enMetaCount=kpisPcts.filter(p=>p>=100).length;
      const avgPct=kpisPcts.filter(p=>p>0).length?kpisPcts.filter(p=>p>0).reduce((a,b)=>a+b,0)/kpisPcts.filter(p=>p>0).length:0;
      const mx=window.__MATRIX__?.[e.id];
      const ret=mx?.ret?.pct_clientes||0;
      const ventas=(db.ventasNuevas||[]).filter(v=>v.ejecutivoId===e.id).length;
      return{e,enMetaCount,totalKpis:kpis.length,avgPct:Math.round(avgPct),ret,ventas,kpisPcts};
    }).sort((a,b)=>b.avgPct-a.avgPct);

    lines.push("### 🏆 Ranking del Equipo");
    teamData.forEach((t,i)=>{
      const mx=window.__MATRIX__?.[t.e.id];
      const retMeta=t.e.role==="Televentas"?80:90;
      const retOk=mx&&t.ret>=retMeta?"✅":"🔴";
      const status=t.avgPct>=100?"🟢":t.avgPct>=75?"🟡":t.avgPct>0?"🔴":"⚫";
      lines.push((i+1)+". **"+t.e.name+"** ("+t.e.role+") "+status+" — "+t.enMetaCount+"/"+t.totalKpis+" KPIs en meta | Avance: "+t.avgPct+"% | Ret: "+t.ret+"% "+retOk+" | Ventas nuevas: "+t.ventas);
    });
    lines.push("");

    // Alertas críticas
    const alertas=teamData.filter(t=>t.avgPct<75&&t.avgPct>0||t.enMetaCount===0&&t.avgPct>0);
    lines.push("### 🚨 Alertas Críticas — Intervención del Director");
    if(alertas.length>0){
      alertas.forEach(t=>{
        const mx=window.__MATRIX__?.[t.e.id];
        const perdidos=mx?.ret?.n_perdidos||0;
        lines.push("- **"+t.e.name+"** ("+t.e.role+"): Avance general "+t.avgPct+"% — "+(perdidos>0?"Tiene "+perdidos+" clientes perdidos. ":"")+"Requiere revisión urgente de KPIs y plan de recuperación");
      });
    } else {
      lines.push("- Equipo en niveles aceptables. Mantener seguimiento semanal.");
    }
    lines.push("");

    // Tendencias
    lines.push("### 📊 Tendencias Generales del Equipo");
    const retBajos=teamData.filter(t=>{const mx=window.__MATRIX__?.[t.e.id];const meta=t.e.role==="Televentas"?80:90;return mx&&mx.ret?.pct_clientes<meta;});
    if(retBajos.length>0) lines.push("- 🔴 **Retención por debajo de meta**: "+retBajos.map(t=>t.e.name).join(", ")+" — Estrategia de rescate necesaria en estos ejecutivos");
    const ventasTotal=(db.ventasNuevas||[]).length;
    lines.push("- 📦 **Ventas nuevas Q3**: "+ventasTotal+" clientes nuevos registrados en total");
    const sinCaptura=teamData.filter(t=>t.avgPct===0);
    if(sinCaptura.length>0) lines.push("- ⚫ **Sin captura de KPIs**: "+sinCaptura.map(t=>t.e.name).join(", ")+" — Solicitar registro inmediato");
    const enMetaEquipo=teamData.filter(t=>t.avgPct>=100);
    if(enMetaEquipo.length>0) lines.push("- ✅ **En meta o superando**: "+enMetaEquipo.map(t=>t.e.name).join(", ")+" — Reconocimiento y mantener ritmo");
    lines.push("");

    // Acciones del director
    lines.push("### 🎯 Acciones del Director — Esta Semana");
    let dirAcc=[];
    if(alertas.length>0) dirAcc.push("**1-on-1 urgente** con "+alertas[0].e.name+(alertas[1]?" y "+alertas[1].e.name:"")+" — Revisar bloqueos y definir plan de recuperación");
    if(retBajos.length>0) dirAcc.push("**Revisión de cartera** con "+retBajos.map(t=>t.e.name).join(", ")+" — Estrategia de rescate para clientes perdidos");
    if(sinCaptura.length>0) dirAcc.push("**Captura de KPIs pendiente**: Solicitar a "+sinCaptura.map(t=>t.e.name).join(", ")+" que registren su avance esta semana");
    dirAcc.push("**Sincronizar indicadores** en el tracker: ir a Comparativo → Sincronizar Indicadores para actualizar avance del equipo");
    dirAcc.push("**Revisión de pipeline Hunter** con Gil y Erick — Estado de oportunidades CRM y próximos cierres");
    dirAcc.slice(0,4).forEach((a,i)=>lines.push((i+1)+". "+a));
    lines.push("");

    // Agenda 1-on-1
    lines.push("### 📋 Agenda de Revisión 1-on-1 Sugerida");
    teamData.forEach((t,i)=>{
      const prioridad=t.avgPct<75?"🔴 URGENTE":t.avgPct<100?"🟡 Revisión":"🟢 Seguimiento";
      const enfoque=t.e.role==="Hunter"?"Pipeline y cierres pendientes"
        :t.ret<(t.e.role==="Televentas"?80:90)?"Estrategia de retención y rescate de clientes"
        :"Avance de KPIs y oportunidades de crecimiento";
      lines.push((i+1)+". **"+t.e.name+"** — "+prioridad+" | Enfoque: "+enfoque);
    });
    lines.push("");
    lines.push("---");
    lines.push("*Resumen ejecutivo generado automáticamente · Dirección Comercial Afimex · "+new Date().toLocaleDateString("es-MX")+"*");
    // ── Top 10 Clientes Críticos ────────────────────────────────
    lines.push("");
    lines.push("## 🔴 TOP 10 CLIENTES CRÍTICOS POR INDICADOR");
    lines.push("");

    // Top 10 peor alcance Presupuesto vs Facturación
    const clientesPpto=[];
    db.team.forEach(ex=>{
      const mx=window.__MATRIX__?.[ex.id];
      if(!mx||!mx.clientes)return;
      mx.clientes.forEach(c=>{
        if(c.ppjul>0&&c.jf26!==undefined){
          const alc=c.ppjul>0?Math.round((c.jf26||0)/c.ppjul*100):null;
          clientesPpto.push({cliente:c.nom,num:c.n,ejec:ex.name,ejecId:ex.id,alc,jf26:c.jf26||0,ppjul:c.ppjul});
        }
      });
    });
    clientesPpto.sort((a,b)=>(a.alc||999)-(b.alc||999));
    if(clientesPpto.length>0){
      lines.push("### 📉 Peor Alcance Presupuesto (Top 10)");
      clientesPpto.slice(0,10).forEach((c,i)=>{
        lines.push((i+1)+". **"+c.cliente+"** ("+c.num+") — Ejec: "+c.ejec+" | PP Jul: "+fmtPeso(c.ppjul)+" | Fact: "+fmtPeso(c.jf26)+" | Alcance: "+(c.alc!=null?c.alc+"%":"S/D"));
      });
      lines.push("");
    }

    // Top 10 clientes con mayor caída en facturación
    const clientesCaida=[];
    db.team.forEach(ex=>{
      const mx=window.__MATRIX__?.[ex.id];
      if(!mx||!mx.clientes)return;
      mx.clientes.forEach(c=>{
        if(c.cft!=null&&c.cft<0){
          clientesCaida.push({cliente:c.nom,num:c.n,ejec:ex.name,cft:c.cft,f25:c.f25,f26:c.f26});
        }
      });
    });
    clientesCaida.sort((a,b)=>a.cft-b.cft);
    if(clientesCaida.length>0){
      lines.push("### 📊 Mayor Caída en Facturación Q3 YoY (Top 10)");
      clientesCaida.slice(0,10).forEach((c,i)=>{
        lines.push((i+1)+". **"+c.cliente+"** ("+c.num+") — Ejec: "+c.ejec+" | 2025: "+fmtPeso(c.f25)+" | 2026: "+fmtPeso(c.f26)+" | Var: "+c.cft+"%");
      });
      lines.push("");
    }

    // Clientes perdidos por ejecutivo
    const perdidos=[];
    db.team.forEach(ex=>{
      const mx=window.__MATRIX__?.[ex.id];
      if(!mx||!mx.clientes)return;
      mx.clientes.filter(c=>c.prd).forEach(c=>{
        perdidos.push({cliente:c.nom,num:c.n,ejec:ex.name,p25:c.p25});
      });
    });
    if(perdidos.length>0){
      lines.push("## ⚠️ CLIENTES PERDIDOS — Plan de Acción");
      lines.push("Total perdidos: **"+perdidos.length+" clientes**");
      lines.push("");
      lines.push("### Plan de Recuperación:");
      lines.push("1. **Contacto inmediato** — Ejecutivo debe llamar en las próximas 48hrs para identificar causa de salida");
      lines.push("2. **Diagnóstico** — ¿Precio? ¿Servicio? ¿Competencia? Documentar en CRM");
      lines.push("3. **Propuesta de reactivación** — Ofrecer condiciones especiales de retorno en primeras 2 semanas");
      lines.push("4. **Seguimiento semanal** — Director debe revisar avance en 1-on-1 de cada ejecutivo");
      lines.push("");
      lines.push("### Listado por ejecutivo:");
      const porEjec={};
      perdidos.forEach(c=>{if(!porEjec[c.ejec])porEjec[c.ejec]=[];porEjec[c.ejec].push(c);});
      Object.entries(porEjec).forEach(([ejec,clts])=>{
        lines.push("**"+ejec+"** ("+clts.length+" perdidos):");
        clts.forEach(c=>lines.push("  - "+c.cliente+" ("+c.num+") — Facturó $"+fmtPeso(c.p25)+" en 2025"));
      });
      lines.push("");
    }

    return lines.join("\n");
  };

  const generate=()=>{
    if(isDir&&mode==="resumen"){
      setHighlights(generateResumen());
    } else {
      const eid=effectiveExecId;
      if(!eid){alert("Selecciona un ejecutivo primero.");return;}
      const plan=generateExecPlan(eid);
      if(!plan){alert("No se encontraron datos del ejecutivo.");return;}
      setHighlights(plan);
    }
  };

  const printPDF=()=>{
    try{
      const name=(isDir&&mode==="resumen")?"Resumen_Equipo":(exec?.name||effectiveExecId||"Plan").replace(/[^a-zA-Z0-9]/g,"_").slice(0,25);
      let body="";
      (highlights||"").split("\n").forEach(function(line){
        if(line.indexOf("## ")===0){body+="<h2>"+line.slice(3)+"</h2>";}
        else if(line.indexOf("### ")===0){body+="<h3>"+line.slice(4)+"</h3>";}
        else if(line==="---"){body+="<hr>";}
        else if(!line.trim()){body+="<br>";}
        else{
          var s=line.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
          s=s.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
          s=s.replace(/- \[ \]/g,"&#9744; ");
          body+="<p>"+s+"</p>";
        }
      });
      var css="body{font-family:Arial,sans-serif;max-width:820px;margin:30px auto;padding:0 24px;color:#1E2A3A;font-size:13px;line-height:1.7}"
        +"h2{color:#0C2B5E;border-bottom:3px solid #F47920;padding-bottom:6px;margin:20px 0 10px;font-size:16px}"
        +"h3{color:#1A56A0;margin:16px 0 6px;font-size:13px;font-weight:800}"
        +"p{margin:3px 0}strong{color:#0C2B5E}hr{border:1px solid #E0EAF5;margin:16px 0}"
        +"@media print{body{margin:15px;font-size:12px}}";
      var doc="<!DOCTYPE html><html><head><meta charset='UTF-8'><title>"+name+"</title>"
        +"<style>"+css+"</style></head><body>"+body+"</body></html>";
      var blob=new Blob([doc],{type:"text/html"});
      var url=URL.createObjectURL(blob);
      var a=document.createElement("a");
      a.href=url;a.download=name+"_Plan_Accion.html";a.style.display="none";
      document.body.appendChild(a);a.click();
      setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(url);},2000);
    }catch(err){alert("Error al descargar: "+err.message);}
  };

  return(
    <div style={{padding:"16px 22px"}}>
      {isDir&&(
        <div style={{background:"#fff",borderRadius:10,border:"1.5px solid "+P.cbd,
          padding:"10px 14px",marginBottom:12,display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
          <div style={{display:"flex",gap:6}}>
            {[["individual","Por ejecutivo"],["resumen","Resumen del equipo"]].map(([v,l])=>(
              <button key={v} onClick={()=>{setMode(v);setHighlights(null);}}
                style={{padding:"6px 14px",borderRadius:20,border:"1.5px solid "+(mode===v?"#0369A1":P.cbd),
                  background:mode===v?"#0369A1":"#fff",color:mode===v?"#fff":P.textMd,
                  fontSize:11,fontWeight:mode===v?700:400,cursor:"pointer"}}>{l}</button>
            ))}
          </div>
          {mode==="individual"&&(
            <select value={selExecDir} onChange={e=>{setSelExecDir(e.target.value);setHighlights(null);}}
              style={{padding:"6px 12px",borderRadius:7,border:"1.5px solid "+P.cbd,fontSize:12,color:P.textDk,background:"#fff",outline:"none"}}>
              <option value="">Seleccionar ejecutivo...</option>
              {db.team.map(e=><option key={e.id} value={e.id}>{e.name} — {e.role}</option>)}
            </select>
          )}
        </div>
      )}
      <div style={{background:"#fff",borderRadius:10,border:"1.5px solid "+P.cbd,
        padding:"13px 16px",marginBottom:12,boxShadow:"0 1px 5px rgba(10,40,90,.06)"}}>
        <div style={{fontSize:12,fontWeight:700,color:P.textDk,marginBottom:5}}>
          {isDir&&mode==="resumen"?"📊 Resumen Ejecutivo del Equipo":"🎯 Plan de Acción"}
          {exec&&!isDir&&<span style={{marginLeft:8,fontSize:10,fontWeight:400,color:roleColor}}>— {exec.role}</span>}
        </div>
        <div style={{fontSize:10,color:P.textMd,marginBottom:11,lineHeight:1.5}}>
          {exec?.role==="Hunter"?"Pipeline de ventas nuevas, brechas vs bono trimestral, cuentas sin activar y estrategia de prospección."
            :isDir&&mode==="resumen"?"Ranking del equipo, alertas críticas y agenda de 1-on-1 basada en indicadores reales."
            :"Clientes en riesgo, caídas de facturación, oportunidades de crecimiento y plan accionable para las próximas 2 semanas."}
        </div>
        <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
          <button onClick={generate} disabled={!effectiveExecId&&!(isDir&&mode==="resumen")}
            style={{padding:"9px 22px",color:"#fff",border:"none",borderRadius:8,fontSize:11,fontWeight:700,
              cursor:(!effectiveExecId&&!(isDir&&mode==="resumen"))?"default":"pointer",
              background:(!effectiveExecId&&!(isDir&&mode==="resumen"))?"#CBD5E1":"#0369A1"}}>
            {isDir&&mode==="resumen"?"📊 Generar Resumen del Equipo":"🎯 Generar Plan de Acción"}
          </button>
          {highlights&&(
            <button onClick={printPDF}
              style={{padding:"9px 20px",background:"#15803D",color:"#fff",border:"none",
                borderRadius:8,fontSize:11,fontWeight:700,cursor:"pointer"}}>
              📄 Descargar para imprimir
            </button>
          )}
        </div>
      </div>
      {highlights&&(
        <div style={{background:"#fff",borderRadius:10,border:"2px solid "+(isDir&&mode==="resumen"?"#0369A1":roleColor),
          padding:"20px 24px",boxShadow:"0 2px 10px rgba(10,40,90,.1)",lineHeight:1.8}}>
          {highlights.split("\n").map((line,i)=>{
            if(line.startsWith("## "))return<h2 key={i} style={{color:P.dark,borderBottom:"2px solid #F47920",paddingBottom:5,marginBottom:8,fontSize:15}}>{line.slice(3)}</h2>;
            if(line.startsWith("### "))return<h3 key={i} style={{color:"#1A56A0",marginTop:12,marginBottom:4,fontSize:12,fontWeight:800}}>{line.slice(4)}</h3>;
            if(line==="---")return<hr key={i} style={{border:"1px solid "+P.cbd,margin:"12px 0"}}/>;
            if(!line.trim())return<br key={i}/>;
            const html=line.replace(/\*\*([^*]+)\*\*/g,(m,t)=>"<b style=\"color:"+P.dark+"\">"+t+"</b>")
              .replace(/- \[ \]/g,"<span style=\"font-size:15px;margin-right:5px\">&#9744;</span>");
            return<p key={i} style={{margin:"2px 0",fontSize:11.5,color:P.textDk}} dangerouslySetInnerHTML={{__html:html}}/>;
          })}
        </div>
      )}
    </div>
  );
}

                <th style={{background:"#15803D",padding:"10px 10px",textAlign:"center",fontSize:9,fontWeight:700,color:"#fff",minWidth:90}}>Creciendo</th>

function App(){
  // Shared storage: use window.storage (artifact mode) or localStorage (local file)
  const [db,setDb]=useState(()=>({team:DEFAULT_TEAM.map(e=>({...e})),weeks:{},ventasNuevas:[],cartera:[]}));
  const [dbReady,setDbReady]=useState(false);
    useEffect(()=>{
    (async()=>{
      try{
        const validIds=new Set(DEFAULT_TEAM.map(e=>e.id));
        let loaded=null;
        // 1) Try window.storage (Claude artifact mode — shared across all users)
        if(typeof window.storage!=="undefined"){
          const r=await window.storage.get("afimex_db",true);
          if(r) loaded=JSON.parse(r.value);
        }
        // 2) Try localStorage (user's own saved data)
        if(!loaded){
          const s=localStorage.getItem(STORE_KEY);
          if(s){
            const d=JSON.parse(s);
            if(Object.keys(d.weeks||{}).length>0||(d.ventasNuevas||[]).length>0||(d.cartera||[]).length>0)
              loaded=d;
          }
        }
        // 3) Try window.__DB__ (embedded by Director in shared HTML)
        if(!loaded&&window.__DB__&&window.__DB__.weeks&&Object.keys(window.__DB__.weeks).length>0){
          loaded=window.__DB__;
          try{localStorage.setItem(STORE_KEY,JSON.stringify({
            weeks:loaded.weeks||{},ventasNuevas:loaded.ventasNuevas||[],cartera:loaded.cartera||[]
          }));}catch{}
        }
        // 4) Auto-pull del cloud (sync ID en localStorage o embebido)
        const sid=localStorage.getItem('afimex_sync_id')||window.__SYNC_ID__;
        if(sid){
          const cloud=await syncPull(sid);
          if(cloud&&Object.keys(cloud.weeks||{}).length>0){
            const validIds2=new Set(DEFAULT_TEAM.map(e=>e.id));
            // Fusionar cloud con lo que ya tenemos localmente
            const mergedW={...(loaded?.weeks||{}),...cloud.weeks};
            // Para cada semana/exec, cloud tiene prioridad sobre window.__DB__ pero no sobre localStorage propio
            if(loaded){
              Object.entries(loaded.weeks||{}).forEach(([wk,execs])=>{
                if(!mergedW[wk])mergedW[wk]={};
                Object.entries(execs).forEach(([eid,d])=>{ mergedW[wk][eid]=d; });
              });
            }
            const vMap={};
            [...(cloud.ventasNuevas||[]),...((loaded?.ventasNuevas)||[])].forEach(v=>{if(v.id)vMap[v.id]=v;});
            const mergedV=Object.values(vMap).filter(x=>validIds2.has(x.ejecutivoId));
            const mergedC=(cloud.cartera||[]).length>=(loaded?.cartera||[]).length?cloud.cartera:loaded?.cartera||[];
            loaded={weeks:mergedW,ventasNuevas:mergedV,cartera:mergedC};
            try{localStorage.setItem(STORE_KEY,JSON.stringify(loaded));}catch{}
          }
        }
        if(loaded){
          const v=(loaded.ventasNuevas||[]).filter(x=>validIds.has(x.ejecutivoId));
          setDb(prev=>({...prev,weeks:loaded.weeks||{},ventasNuevas:v,cartera:loaded.cartera||[]}));
        }
      }catch(e){}
      setDbReady(true);
    })();
  },[]);
  const [syncStatus,setSyncStatus]=useState(null); // null | 'syncing' | 'ok' | 'error'

  // Auto-load from cloud on first open if localStorage is empty
  useEffect(()=>{
    const sid=localStorage.getItem('afimex_sync_id')||window.__SYNC_ID__;
    if(!sid)return;
    const isEmpty=Object.keys(db.weeks||{}).length===0&&(db.ventasNuevas||[]).length===0;
    if(!isEmpty)return; // ya tenemos datos locales
    setSyncStatus('syncing');
    syncPull(sid).then(data=>{
      if(!data){setSyncStatus('error');return;}
      const validIds=new Set(DEFAULT_TEAM.map(e=>e.id));
      const v=(data.ventasNuevas||[]).filter(x=>validIds.has(x.ejecutivoId));
      const nd={...db,weeks:data.weeks||{},ventasNuevas:v,cartera:data.cartera||[]};
      try{localStorage.setItem(STORE_KEY,JSON.stringify(nd));}catch{}
      setDb(nd);
      setSyncStatus('ok');
    }).catch(()=>setSyncStatus('error'));
  },[]);

        autoBonoFills[1]=String(Math.round(ventasTotalFact)); // Bono 1 trim.
      }
    }
    setVals({...savedVals,...autoFills});
    setBonoVals({...savedBonos,...autoBonoFills});
    // Load ratio numerator/denominator from saved data
    const savedRatio=wd?.ratioVals||{};
    setRatioVals(savedRatio);
    setClientes(wd?.clientes||["","",""]);
    setCompromisos(wd?.compromisos||["","",""]);

  const setV=(k,v)=>setVals(p=>({...p,[k]:v}));
  const setB=(k,v)=>setBonoVals(p=>({...p,[k]:v}));
